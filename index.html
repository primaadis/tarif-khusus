<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TARSUS FINDER</title>

    <meta name="description"
          content="Pencarian tarif khusus kereta api">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                "Inter",
                system-ui,
                sans-serif;

            color: #eef3f8;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 107, 26, .12),
                    transparent 34%
                ),
                #07111f;

            overflow-x: hidden;

            -webkit-tap-highlight-color:
                transparent;
        }

        body::before {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            top: -250px;
            right: -180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 107, 26, .08),
                    transparent 68%
                );

            pointer-events: none;

            z-index: -1;
        }

        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            bottom: -240px;
            left: -180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(20, 70, 110, .18),
                    transparent 70%
                );

            pointer-events: none;

            z-index: -1;
        }

        .app {
            width: 100%;
            max-width: 820px;

            margin: auto;

            padding:
                24px 16px 50px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: relative;

            padding:
                18px 4px 28px;

            text-align: center;
        }

        .header::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 7px;

            width: 70px;
            height: 2px;

            transform:
                translateX(-50%);

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff6b1a,
                    transparent
                );

            box-shadow:
                0 0 12px
                rgba(255, 107, 26, .3);
        }

        .brand {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 9px;
        }

        .brand-mark {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #ff8540,
                    #ed5008
                );

            border:
                1px solid
                rgba(255, 255, 255, .12);

            box-shadow:
                0 7px 20px
                rgba(255, 88, 10, .16);

            font-size: 18px;

            transform:
                rotate(-3deg);
        }

        .brand-name {
            font-family:
                "Manrope",
                sans-serif;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: .08em;

            line-height: 1;

            color: #ffffff;
        }

        .brand-name::after {
            content: "";

            display: block;

            width: 24px;
            height: 2px;

            margin-top: 6px;

            border-radius: 10px;

            background:
                #ff6b1a;
        }

        .subtitle {
            color: #8795a5;

            font-size: 10px;

            letter-spacing: .08em;

            text-transform:
                uppercase;
        }

        /* =========================
           SEARCH PANEL
        ========================= */

        .search-panel {
            padding: 17px;

            border:
                1px solid
                rgba(255, 255, 255, .07);

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 35, 55, .94),
                    rgba(9, 23, 39, .94)
                );

            box-shadow:
                0 16px 42px
                rgba(0, 0, 0, .23);

            backdrop-filter:
                blur(10px);
        }

        .route-wrapper {
            display: grid;

            grid-template-columns:
                1fr 42px 1fr;

            gap: 10px;

            align-items: end;
        }

        .field {
            position: relative;
        }

        .field-label {
            display: block;

            margin:
                0 0 7px 2px;

            color: #8290a0;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: .08em;

            text-transform:
                uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .station-input {
            width: 100%;

            height: 44px;

            padding:
                0 13px;

            border:
                1px solid
                rgba(255, 255, 255, .08);

            border-radius: 12px;

            outline: none;

            background:
                rgba(5, 16, 29, .72);

            color: #f4f7fa;

            font-family:
                "Inter",
                sans-serif;

            font-size: 13px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .station-input::placeholder {
            color: #526173;
        }

        .station-input:focus {
            border-color:
                rgba(255, 107, 26, .65);

            background:
                rgba(5, 16, 29, .9);

            box-shadow:
                0 0 0 3px
                rgba(255, 107, 26, .08);
        }

        /* =========================
           STATION SUGGESTIONS
        ========================= */

        .suggestions {
            position: absolute;

            top: calc(100% + 6px);

            left: 0;
            right: 0;

            z-index: 50;

            overflow: hidden;

            border:
                1px solid
                rgba(255, 255, 255, .08);

            border-radius: 12px;

            background:
                #102238;

            box-shadow:
                0 14px 30px
                rgba(0, 0, 0, .35);
        }

        .suggestion-item {
            display: flex;

            flex-direction: column;

            gap: 3px;

            padding:
                10px 12px;

            color: #dbe4ec;

            font-size: 12px;

            cursor: pointer;

            border-bottom:
                1px solid
                rgba(255, 255, 255, .05);

            transition:
                background .15s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover,
        .suggestion-item:active {
            background:
                rgba(255, 107, 26, .1);

            color: #ffffff;
        }

        .suggestion-name {
            font-weight: 700;

            color: #f0f4f8;
        }

        .suggestion-meta {
            color: #728397;

            font-size: 9px;
        }

        /* =========================
           SWAP
        ========================= */

        .swap-button {
            width: 42px;
            height: 42px;

            border:
                1px solid
                rgba(255, 255, 255, .08);

            border-radius: 12px;

            background:
                rgba(255, 255, 255, .035);

            color: #ff8a4c;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .swap-button:hover {
            background:
                rgba(255, 107, 26, .09);

            border-color:
                rgba(255, 107, 26, .25);
        }

        .swap-button:active {
            transform:
                scale(.94);
        }

        /* =========================
           SEARCH BUTTON
        ========================= */

        .search-button {
            width: 100%;

            height: 44px;

            margin-top: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff7b32,
                    #f0540b
                );

            color: #ffffff;

            font-family:
                "Inter",
                sans-serif;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: .02em;

            cursor: pointer;

            box-shadow:
                0 8px 24px
                rgba(255, 107, 26, .14);

            transition:
                transform .2s ease,
                filter .2s ease;
        }

        .search-button:hover {
            filter:
                brightness(1.06);
        }

        .search-button:active {
            transform:
                scale(.985);
        }

        button,
        input {
            -webkit-tap-highlight-color:
                transparent;
        }

        button {
            -webkit-appearance:
                none;

            appearance: none;
        }

        button:focus,
        button:focus-visible {
            outline: none;
        }

        .search-button:focus,
        .search-button:focus-visible {
            outline: none;

            box-shadow:
                0 8px 24px
                rgba(255, 107, 26, .14);
        }

        .swap-button:focus,
        .swap-button:focus-visible {
            outline: none;

            box-shadow: none;
        }

        /* =========================
           DATABASE STATUS
        ========================= */

        .database-status {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 12px;

            color: #647386;

            font-size: 10px;

            text-align: center;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                #39d98a;

            box-shadow:
                0 0 8px
                rgba(57, 217, 138, .45);
        }

        /* =========================
           RESULTS
        ========================= */

        .result-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin:
                26px 3px 12px;
        }

        .result-title {
            color: #f3f6f9;

            font-size: 13px;

            font-weight: 700;
        }

        .result-count {
            color: #778698;

            font-size: 10px;

            white-space:
                nowrap;
        }

        #results {
            display: grid;

            gap: 10px;
        }

        .result-card {
            padding: 14px;

            border:
                1px solid
                rgba(255, 255, 255, .065);

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(16, 34, 53, .96),
                    rgba(8, 21, 36, .96)
                );

            box-shadow:
                0 10px 28px
                rgba(0, 0, 0, .18);

            animation:
                resultIn .35s ease both;
        }

        @keyframes resultIn {

            from {
                opacity: 0;

                transform:
                    translateY(7px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .result-train {
            color: #ffffff;

            font-family:
                "Manrope",
                sans-serif;

            font-size: 16px;

            font-weight: 800;
        }

        .result-route {
            margin-top: 5px;

            color: #a9b6c4;

            font-size: 11px;

            font-weight: 500;
        }

        /* =========================
           SPECIAL ROUTE
        ========================= */

        .special-route {
            margin-top: 10px;

            padding:
                8px 10px;

            border-left:
                2px solid
                #ff6b1a;

            border-radius:
                0 8px 8px 0;

            background:
                rgba(255, 107, 26, .055);

            color: #7f8e9f;

            font-size: 10px;

            line-height: 1.5;
        }

        .special-route strong {
            color: #d7e0e8;

            font-weight: 600;
        }

        /* =========================
           FARES
        ========================= */

        .fare-list {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 11px;
        }

        .fare-item {
            min-width: 0;

            padding:
                9px 8px;

            border:
                1px solid
                rgba(255, 255, 255, .055);

            border-radius: 10px;

            background:
                rgba(0, 0, 0, .14);

            text-align: center;
        }

        .fare-label {
            color: #718093;

            font-size: 9px;

            font-weight: 700;

            text-transform:
                uppercase;

            letter-spacing: .04em;
        }

        .fare-price {
            margin-top: 4px;

            color: #ff9a68;

            font-size: 12px;

            font-weight: 800;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            display: none;

            padding:
                18px 10px;

            color: #788798;

            font-size: 11px;

            text-align: center;
        }

        .loading-spinner {
            width: 22px;
            height: 22px;

            margin:
                0 auto 8px;

            border:
                2px solid
                rgba(255, 255, 255, .08);

            border-top-color:
                #ff6b1a;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            display: none;

            padding:
                28px 15px;

            border:
                1px solid
                rgba(255, 255, 255, .05);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, .02);

            color: #68788b;

            font-size: 11px;

            line-height: 1.6;

            text-align: center;
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            display: none;

            margin-top: 12px;

            padding:
                10px 12px;

            border:
                1px solid
                rgba(255, 75, 75, .16);

            border-radius: 10px;

            background:
                rgba(255, 75, 75, .06);

            color: #ff9696;

            font-size: 10px;

            line-height: 1.5;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 30px;

            color: #4e5d6d;

            font-size: 9px;

            line-height: 1.6;

            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 560px) {

            .app {
                padding:
                    18px 12px 40px;
            }

            .header {
                padding:
                    14px 4px 26px;
            }

            .brand-mark {
                width: 36px;
                height: 36px;

                border-radius: 11px;

                font-size: 16px;
            }

            .brand-name {
                font-size: 22px;
            }

            .subtitle {
                font-size: 9px;
            }

            .search-panel {
                padding: 14px;

                border-radius: 16px;
            }

            .route-wrapper {
                grid-template-columns:
                    1fr 38px 1fr;

                gap: 7px;
            }

            .field-label {
                font-size: 9px;
            }

            .station-input {
                height: 42px;

                padding:
                    0 11px;

                font-size: 12px;
            }

            .swap-button {
                width: 38px;
                height: 38px;

                font-size: 16px;
            }

            .search-button {
                height: 42px;

                margin-top: 12px;

                font-size: 12px;
            }

            .result-header {
                margin-top: 22px;
            }

            .result-title {
                font-size: 12px;
            }

            .result-count {
                font-size: 9px;
            }

            .result-card {
                padding: 13px;

                border-radius: 14px;
            }

            .result-train {
                font-size: 15px;
            }

            .result-route {
                font-size: 10px;
            }

            .special-route {
                font-size: 9px;
            }

            .fare-list {
                gap: 6px;
            }

            .fare-item {
                padding:
                    8px 5px;
            }

            .fare-label {
                font-size: 8px;
            }

            .fare-price {
                font-size: 11px;
            }
        }

        @media (max-width: 360px) {

            .app {
                padding-left: 9px;
                padding-right: 9px;
            }

            .search-panel {
                padding: 12px;
            }

            .route-wrapper {
                grid-template-columns:
                    1fr 34px 1fr;

                gap: 5px;
            }

            .swap-button {
                width: 34px;
                height: 36px;
            }

            .brand-name {
                font-size: 20px;
            }
        }

    </style>

</head>


<body>

    <main class="app">

        <!-- =========================
             HEADER
        ========================= -->

        <header class="header">

            <div class="brand">

                <div class="brand-mark">
                    🚆
                </div>

                <div class="brand-name">
                    TARSUS
                </div>

            </div>

            <div class="subtitle">
                Tarif Khusus Kereta Api
            </div>

        </header>


        <!-- =========================
             SEARCH PANEL
        ========================= -->

        <section class="search-panel">

            <div class="route-wrapper">


                <!-- =====================
                     ASAL
                ====================== -->

                <div class="field">

                    <label
                        class="field-label"
                        for="asal">

                        Stasiun Asal

                    </label>

                    <div class="input-wrap">

                        <input
                            id="asal"
                            class="station-input"
                            type="text"
                            placeholder="Contoh: Cimahi"
                            autocomplete="off"
                            spellcheck="false"
                            data-station-role="asal">

                        <div
                            id="suggestionsAsal"
                            class="suggestions"
                            role="listbox">
                        </div>

                    </div>

                </div>


                <!-- =====================
                     TUKAR
                ====================== -->

                <button
                    id="swapBtn"
                    class="swap-button"
                    type="button"
                    aria-label="Tukar stasiun">

                    ⇄

                </button>


                <!-- =====================
                     TUJUAN
                ====================== -->

                <div class="field">

                    <label
                        class="field-label"
                        for="tujuan">

                        Stasiun Tujuan

                    </label>

                    <div class="input-wrap">

                        <input
                            id="tujuan"
                            class="station-input"
                            type="text"
                            placeholder="Contoh: Cirebon"
                            autocomplete="off"
                            spellcheck="false"
                            data-station-role="tujuan">

                        <div
                            id="suggestionsTujuan"
                            class="suggestions"
                            role="listbox">
                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================
                 SEARCH BUTTON
            ========================== -->

            <button
                id="searchBtn"
                class="search-button"
                type="button">

                🔎 Cari Tarif Khusus

            </button>


            <!-- =========================
                 LOADING
            ========================== -->

            <div
                id="loading"
                class="loading">

                <div
                    class="loading-spinner">
                </div>

                Menghubungkan database...

            </div>


            <!-- =========================
                 DATABASE STATUS
            ========================== -->

            <div
                class="database-status">

                <span
                    id="statusDot"
                    class="status-dot">
                </span>

                <span id="status">
                    Menghubungkan database...
                </span>

            </div>


            <!-- =========================
                 ERROR
            ========================== -->

            <div
                id="errorBox"
                class="error-box">
            </div>

        </section>


        <!-- =========================
             RESULT SECTION
        ========================== -->

        <section>

            <div
                class="result-header">

                <div
                    class="result-title">

                    Hasil Pencarian

                </div>

                <div
                    id="resultCount"
                    class="result-count">

                    Belum ada pencarian

                </div>

            </div>


            <!-- HASIL AKAN DIISI data.js -->

            <div
                id="results">
            </div>


            <!-- TIDAK ADA HASIL -->

            <div
                id="empty"
                class="empty">

                Tidak ditemukan tarif khusus
                untuk rute yang kamu cari.

            </div>

        </section>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="footer">

            TARSUS FINDER
            •
            Database Tarif Khusus Kereta Api

            <br>

            Data stasiun mengikuti daftar
            layanan KA antarkota.

        </footer>

    </main>


    <!-- =============================
         DATABASE / JAVASCRIPT
    ============================== -->

    <script
        src="data.js">
    </script>

</body>

</html>
