<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TARSUS Finder</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    color: #102a43;

    background:
        linear-gradient(
            180deg,
            #eef6fc 0%,
            #f7fbfe 55%,
            #edf4f9 100%
        );

    overflow-x: hidden;
}


/* =========================
   HERO
========================= */

.hero {

    position: relative;

    min-height: 410px;

    padding:
        45px
        20px
        135px;

    overflow: hidden;

    text-align: center;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(44,164,255,.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 35%,
            rgba(0,204,255,.14),
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #061524,
            #092842 48%,
            #061827
        );
}


/* =========================
   GLOW
========================= */

.hero::before {

    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    top: -130px;
    left: -80px;

    background:
        rgba(53,175,255,.12);

    filter: blur(10px);

    animation:
        floatingGlow
        7s
        ease-in-out
        infinite;
}


.hero::after {

    content: "";

    position: absolute;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    right: -160px;
    bottom: -190px;

    background:
        rgba(0,174,255,.10);

    filter: blur(15px);

    animation:
        floatingGlow
        9s
        ease-in-out
        infinite
        reverse;
}


@keyframes floatingGlow {

    0%,100% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(25px,18px)
            scale(1.08);
    }

}


/* =========================
   BASIC TEXT
========================= */

.hero h1 {

    position: relative;

    z-index: 5;

    font-size:
        clamp(
            42px,
            11vw,
            72px
        );

    line-height: 1;

    font-weight: 900;

    letter-spacing: -3px;

    color: #ffffff;
}


.hero h1 span {

    color: #70c9ff;

}


.hero-subtitle {

    position: relative;

    z-index: 5;

    max-width: 420px;

    margin:
        17px
        auto
        0;

    color: #94abc0;

    font-size: 13px;

    line-height: 1.7;

}
    /* =========================
   KAI 121 IDENTITY
========================= */

.brand-mini {

    position: relative;

    z-index: 10;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 28px;

    padding: 7px 13px;

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 999px;

    background:
        rgba(255,255,255,.045);

    color: #b9cddd;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

    backdrop-filter: blur(10px);

}


.brand-mini .dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #64c8ff;

    box-shadow:
        0 0 8px #64c8ff,
        0 0 18px rgba(100,200,255,.7);

    animation:
        pulseDot
        1.8s
        ease-in-out
        infinite;
}


@keyframes pulseDot {

    0%,100% {
        opacity: .55;
        transform: scale(.85);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }

}


/* =========================
   EYEBROW
========================= */

.eyebrow {

    position: relative;

    z-index: 5;

    margin-bottom: 12px;

    color: #6bbfff;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 4px;

    text-transform: uppercase;
}


/* =========================
   DIGITAL RAIL
========================= */

.digital-rail {

    position: absolute;

    z-index: 1;

    left: 0;
    right: 0;

    bottom: 48px;

    height: 85px;

    opacity: .75;

    transform:
        perspective(500px)
        rotateX(58deg);

}


/* rail lines */

.digital-rail::before,
.digital-rail::after {

    content: "";

    position: absolute;

    left: -10%;

    width: 120%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(89,195,255,.15),
            rgba(89,195,255,.8),
            rgba(89,195,255,.15),
            transparent
        );

    box-shadow:
        0 0 10px rgba(89,195,255,.45);

}


.digital-rail::before {
    top: 20px;
}


.digital-rail::after {
    top: 62px;
}


/* sleepers */

.rail-sleepers {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 28px,
            rgba(91,190,245,.18) 29px,
            rgba(91,190,245,.18) 31px,
            transparent 32px,
            transparent 58px
        );

    animation:
        railMove
        2.5s
        linear
        infinite;
}


@keyframes railMove {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-58px);
    }

}


/* =========================
   MOVING LIGHT
========================= */

.rail-light {

    position: absolute;

    top: 18px;

    left: -80px;

    width: 75px;

    height: 45px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(110,211,255,.9) 0%,
            rgba(110,211,255,.25) 35%,
            transparent 72%
        );

    filter: blur(2px);

    animation:
        railLight
        4s
        linear
        infinite;
}


@keyframes railLight {

    0% {
        left: -100px;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    80% {
        opacity: .9;
    }

    100% {
        left: calc(100% + 100px);
        opacity: 0;
    }

}


/* =========================
   SEARCH WRAPPER
========================= */

.search-wrap {

    position: relative;

    z-index: 20;

    width: min(
        920px,
        calc(100% - 28px)
    );

    margin:
        -92px
        auto
        0;

}


/* =========================
   SEARCH CARD
========================= */

.search-card {

    position: relative;

    padding: 25px;

    border:
        1px solid
        rgba(255,255,255,.7);

    border-radius: 24px;

    background:
        rgba(255,255,255,.94);

    box-shadow:
        0 25px 70px rgba(14,52,78,.15),
        0 8px 25px rgba(14,52,78,.08);

    backdrop-filter:
        blur(20px);

    animation:
        cardAppear
        .7s
        ease-out
        both;
}


@keyframes cardAppear {

    from {
        opacity: 0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   SEARCH GRID
========================= */

.search-grid {

    display: grid;

    grid-template-columns:
        1fr
        48px
        1fr
        150px;

    align-items: end;

    gap: 12px;

}


/* =========================
   FIELD
========================= */

.field {

    position: relative;

    min-width: 0;
}


.field-label {

    display: block;

    margin:
        0
        0
        8px
        4px;

    color: #60788c;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.4px;

    text-transform: uppercase;
}


.field-box {

    position: relative;

    display: flex;

    align-items: center;

    height: 54px;

    overflow: hidden;

    border:
        1px solid
        #d9e5ee;

    border-radius: 15px;

    background: #f8fbfd;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}


.field-box:focus-within {

    border-color: #55bfff;

    background: #ffffff;

    box-shadow:
        0 0 0 4px
        rgba(63,185,255,.10);
}


.field-icon {

    flex: 0 0 42px;

    text-align: center;

    color: #53aede;

    font-size: 17px;
}


.field input {

    width: 100%;

    height: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #15364d;

    font-family: inherit;

    font-size: 14px;

    font-weight: 600;
}


.field input::placeholder {

    color: #9aabba;

    font-weight: 500;
}


/* =========================
   SWAP BUTTON
========================= */

.swap-area {

    display: flex;

    justify-content: center;

    align-items: center;

    padding-bottom: 5px;
}


.swap-btn {

    width: 42px;
    height: 42px;

    border:
        1px solid
        #d5e3ec;

    border-radius: 50%;

    background: #ffffff;

    color: #409ac9;

    cursor: pointer;

    font-size: 20px;

    box-shadow:
        0 5px 16px rgba(22,72,103,.10);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}


.swap-btn:hover {

    transform:
        rotate(180deg)
        scale(1.05);

    background: #eef9ff;

    box-shadow:
        0 8px 20px
        rgba(38,151,207,.18);
}


.swap-btn:active {

    transform:
        rotate(180deg)
        scale(.92);
}


/* =========================
   SUGGESTION DROPDOWN
========================= */

.suggestions {

    position: absolute;

    z-index: 100;

    top: calc(100% + 8px);

    left: 0;
    right: 0;

    display: none;

    max-height: 230px;

    overflow-y: auto;

    padding: 6px;

    border:
        1px solid
        #dce8ef;

    border-radius: 14px;

    background:
        rgba(255,255,255,.98);

    box-shadow:
        0 18px 35px
        rgba(20,65,90,.16);
}


.suggestion-item {

    padding:
        11px
        12px;

    border-radius: 10px;

    color: #294b62;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease;
}


.suggestion-item:hover {

    background: #edf8fe;

    color: #1686c2;
}


/* =========================
   SEARCH BUTTON
========================= */

.search-btn {

    position: relative;

    height: 54px;

    overflow: hidden;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #087db8,
            #27b7ed
        );

    color: white;

    font-family: inherit;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: .8px;

    cursor: pointer;

    box-shadow:
        0 10px 24px
        rgba(20,139,194,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.search-btn::before {

    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: -80px;

    width: 50px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine
        3.2s
        ease-in-out
        infinite;
}


@keyframes buttonShine {

    0% {
        left: -80px;
    }

    45%,100% {
        left: calc(100% + 80px);
    }

}


.search-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 14px 30px
        rgba(20,139,194,.32);
}


.search-btn:active {

    transform:
        translateY(0)
        scale(.98);
}


.search-btn span {

    position: relative;

    z-index: 2;
                      }
    /* =========================
   CONTENT AREA
========================= */

.content {

    width: min(
        920px,
        calc(100% - 28px)
    );

    margin:
        42px
        auto
        0;

}


/* =========================
   SECTION TITLE
========================= */

.section-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 18px;
}


.section-title {

    color: #173b53;

    font-size: 18px;

    font-weight: 850;

    letter-spacing: -.4px;
}


.section-desc {

    margin-top: 4px;

    color: #8296a5;

    font-size: 11px;
}


/* =========================
   STATUS
========================= */

.status {

    min-height: 20px;

    color: #7690a1;

    font-size: 11px;

    font-weight: 600;

    text-align: right;
}


/* =========================
   LOADING
========================= */

.loading {

    display: none;

    align-items: center;

    justify-content: center;

    gap: 7px;

    min-height: 120px;

    color: #6d899c;

    font-size: 12px;
}


.loading.active {

    display: flex;
}


.loading-dots {

    display: flex;

    gap: 4px;
}


.loading-dots i {

    display: block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #39aee4;

    animation:
        loadingDot
        1s
        ease-in-out
        infinite;
}


.loading-dots i:nth-child(2) {

    animation-delay: .15s;
}


.loading-dots i:nth-child(3) {

    animation-delay: .3s;
}


@keyframes loadingDot {

    0%,80%,100% {

        transform: translateY(0);

        opacity: .35;
    }

    40% {

        transform: translateY(-5px);

        opacity: 1;
    }

}


/* =========================
   EMPTY STATE
========================= */

.empty {

    display: none;

    padding: 35px 20px;

    border:
        1px dashed
        #cfdee7;

    border-radius: 18px;

    background:
        rgba(255,255,255,.55);

    color: #78909f;

    font-size: 12px;

    text-align: center;
}


.empty.active {

    display: block;

}


/* =========================
   RESULT LIST
========================= */

.results {

    display: grid;

    gap: 14px;

}


/* =========================
   TRAIN CARD
========================= */

.train-card {

    position: relative;

    overflow: hidden;

    padding: 20px;

    border:
        1px solid
        #e0eaf0;

    border-radius: 19px;

    background: #ffffff;

    box-shadow:
        0 8px 25px
        rgba(24,67,91,.07);

    animation:
        resultAppear
        .5s
        ease-out
        both;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.train-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 14px 32px
        rgba(24,67,91,.11);
}


.train-card::before {

    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 3px;

    background:
        linear-gradient(
            180deg,
            #2db8f2,
            #087db8
        );
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =========================
   TRAIN HEADER
========================= */

.train-header {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 17px;
}


.train-name {

    color: #143b54;

    font-size: 16px;

    font-weight: 850;
}


.route {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 7px;

    color: #718999;

    font-size: 11px;

    font-weight: 600;
}


.route-line {

    display: inline-block;

    width: 25px;

    height: 1px;

    background:
        #b7cbd8;
}


.availability {

    flex-shrink: 0;

    padding:
        6px
        9px;

    border-radius: 999px;

    background:
        #eaf9f2;

    color:
        #269261;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: .7px;
}


/* =========================
   FARE GRID
========================= */

.fare-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                150px,
                1fr
            )
        );

    gap: 9px;
}


.fare-item {

    padding:
        13px
        14px;

    border:
        1px solid
        #e4edf2;

    border-radius: 13px;

    background:
        #f8fbfd;
}


.fare-class {

    margin-bottom: 5px;

    color: #8297a5;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
}


.fare-price {

    color: #17638a;

    font-size: 15px;

    font-weight: 850;
}


.fare-time {

    margin-top: 5px;

    color: #8196a5;

    font-size: 10px;

    font-weight: 600;
}


/* =========================
   RESULT COUNT
========================= */

.result-count {

    margin-top: 20px;

    color: #91a2ad;

    font-size: 10px;

    text-align: center;
}


/* =========================
   FOOTER
========================= */

.footer {

    width: min(
        920px,
        calc(100% - 28px)
    );

    margin:
        70px
        auto
        25px;

    padding-top: 18px;

    border-top:
        1px solid
        #dfe9ef;

    color: #91a1ac;

    font-size: 10px;

    text-align: center;

    letter-spacing: .5px;
}


/* =========================
   ERROR MESSAGE
========================= */

.error-box {

    display: none;

    margin-bottom: 15px;

    padding:
        13px
        15px;

    border:
        1px solid
        #f0d7d7;

    border-radius: 13px;

    background:
        #fff7f7;

    color:
        #b45f5f;

    font-size: 11px;

    line-height: 1.6;
}


.error-box.active {

    display: block;

}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {

    width: 7px;
}


::-webkit-scrollbar-track {

    background: #edf3f7;
}


::-webkit-scrollbar-thumb {

    border-radius: 10px;

    background: #b7d1df;
}


::-webkit-scrollbar-thumb:hover {

    background: #8fb8cd;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .hero {

        min-height: 390px;

        padding:
            32px
            14px
            120px;
    }


    .brand-mini {

        margin-bottom: 23px;

        padding:
            6px
            11px;

        font-size: 9px;

        letter-spacing: 1.5px;
    }


    .eyebrow {

        font-size: 8px;

        letter-spacing: 3px;
    }


    .hero h1 {

        font-size:
            clamp(
                42px,
                16vw,
                60px
            );

        letter-spacing: -2.5px;
    }


    .hero-subtitle {

        max-width: 330px;

        margin-top: 14px;

        font-size: 11px;

        line-height: 1.65;
    }


    .digital-rail {

        bottom: 40px;

        height: 70px;
    }


    .search-wrap {

        width:
            calc(100% - 20px);

        margin-top: -82px;
    }


    .search-card {

        padding: 17px;

        border-radius: 20px;
    }


    .search-grid {

        grid-template-columns:
            1fr;

        gap: 10px;
    }


    .swap-area {

        position: absolute;

        z-index: 5;

        right: 25px;

        top: 76px;

        padding: 0;
    }


    .swap-btn {

        width: 37px;
        height: 37px;

        font-size: 17px;
    }


    .field-box {

        height: 51px;

        padding-right: 35px;
    }


    .search-btn {

        height: 51px;

        margin-top: 3px;
    }


    .content {

        width:
            calc(100% - 20px);

        margin-top: 32px;
    }


    .section-head {

        align-items: flex-end;

        margin-bottom: 14px;
    }


    .section-title {

        font-size: 16px;
    }


    .section-desc {

        font-size: 10px;
    }


    .status {

        font-size: 9px;
    }


    .train-card {

        padding: 16px;

        border-radius: 17px;
    }


    .train-header {

        gap: 8px;
    }


    .train-name {

        font-size: 14px;
    }


    .route {

        font-size: 10px;

        flex-wrap: wrap;
    }


    .availability {

        padding:
            5px
            7px;

        font-size: 8px;
    }


    .fare-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
    }


    .fare-item {

        padding:
            11px
            10px;
    }


    .fare-price {

        font-size: 13px;
    }


    .fare-time {

        font-size: 9px;
    }


    .footer {

        width:
            calc(100% - 20px);

        margin-top: 55px;
    }

}


/* =========================
   VERY SMALL SCREEN
========================= */

@media (max-width: 380px) {

    .hero h1 {

        font-size: 40px;
    }


    .search-card {

        padding: 14px;
    }


    .fare-grid {

        grid-template-columns:
            1fr;
    }


    .train-header {

        flex-direction: column;
    }


    .availability {

        align-self: flex-start;
    }

    }
    </style>

</head>


<body>


<!-- =========================
     HERO
========================= -->

<section class="hero">


    <div class="brand-mini">

        <span class="dot"></span>

        KAI • 121

    </div>


    <div class="eyebrow">

        SPECIAL FARE

    </div>


    <h1>

        TARSUS
        <span>Finder</span>

    </h1>


    <p class="hero-subtitle">

        Temukan informasi tarif khusus
        berdasarkan relasi perjalanan.

    </p>


    <!-- DIGITAL RAIL -->

    <div class="digital-rail">

        <div class="rail-sleepers"></div>

        <div class="rail-light"></div>

    </div>


</section>



<!-- =========================
     SEARCH
========================= -->

<div class="search-wrap">


    <div class="search-card">


        <div class="search-grid">


            <!-- ASAL -->

            <div class="field">

                <label class="field-label">

                    Stasiun Asal

                </label>


                <div class="field-box">

                </label>


                <div class="field-box">

                    </div>


                    <input
                        type="text"
                        id="tujuan"
                        placeholder="Ketik stasiun tujuan..."

                    >

                </div>

            <button

========================= -->

<main class="content">


    <div class="section-head">


        <div>

            <div class="section-title">

                Hasil Tarif Khusus

            <div class="section-desc">

                Pilih relasi untuk melihat tarif yang tersedia.

            </div>

        <div
            class="status"

        >

            Memuat database...

        </div>

    <div

    <div

        <span class="loading-dots">

    <div

        Masukkan stasiun asal dan tujuan,

<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   GOOGLE SHEETS
========================= */


const CSV_URL =
    "https://docs.google.com/spreadsheets/d/1a4Ln_wASazV35F2M3MKZcJHEmiAV8G-0WmkMmU4Csls/gviz/tq?tqx=out:csv&sheet=Tarif%20Khusus";


/* =========================
   ELEMENTS
========================= */


const asalInput =
    document.getElementById("asal");


const tujuanInput =
    document.getElementById("tujuan");


const asalSuggestions =
    document.getElementById(
        "asalSuggestions"
    );


const tujuanSuggestions =
    document.getElementById(
        "tujuanSuggestions"
    );


const swapBtn =
    document.getElementById("swapBtn");


const searchBtn =
    document.getElementById("searchBtn");


const results =
    document.getElementById("results");


const loading =
    document.getElementById("loading");


const empty =
    document.getElementById("empty");


const status =
    document.getElementById("status");


const errorBox =
    document.getElementById("errorBox");


const resultCount =
    document.getElementById("resultCount");


/* =========================
   DATABASE
========================= */


let database = [];

let stations = [];


/* =========================
   NORMALIZE TEXT
========================= */


function normalize(text) {

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


/* =========================
   FORMAT PRICE
========================= */


function formatRupiah(value) {

    const number =
        Number(
            String(value)
                .replace(/[^\d]/g, "")
        );


    if (!number) {

        return "-";

    }


    return "Rp " +
        number.toLocaleString("id-ID");

}


/* =========================
   ESCAPE HTML
========================= */


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   CSV PARSER
========================= */


function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            cell += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(cell);

            cell = "";

            continue;

        }


        if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

            continue;

        }


        cell += char;

    }


    if (
        cell !== "" ||
        row.length > 0
    ) {

        row.push(cell);

        rows.push(row);

    }


    return rows;

}


/* =========================
   LOAD DATABASE
========================= */


async function loadDatabase() {

    try {

        status.textContent =
            "Menghubungkan database...";


        const response =
            await fetch(
                CSV_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Google Sheets tidak dapat diakses."
            );

        }


        const csv =
            await response.text();


        if (
            !csv ||
            csv.trim().length < 10
        ) {

            throw new Error(
                "Data Google Sheets kosong."
            );

        }


        const rows =
            parseCSV(csv);


        if (!rows.length) {

            throw new Error(
                "Database tidak memiliki data."
            );

        }


        database = [];


        /*
         FORMAT DATABASE:

         0 = kereta
         1 = stasiunAsal
         2 = stasiunTujuan
         3 = kelas
         4 = tarif
         5 = keberangkatan
        */


        rows.forEach(
            (row, index) => {

                if (
                    index === 0 &&
                    normalize(row[0])
                        === "kereta"
                ) {

                    return;

                }


                if (
                    !row[0] ||
                    !row[1] ||
                    !row[2]
                ) {

                    return;

                }


                database.push({

                    kereta:
                        String(
                            row[0] || ""
                        ).trim(),

                    asal:
                        String(
                            row[1] || ""
                        ).trim(),

                    tujuan:
                        String(
                            row[2] || ""
                        ).trim(),

                    kelas:
                        String(
                            row[3] || ""
                        ).trim(),

                    tarif:
                        String(
                            row[4] || ""
                        ).trim(),

                    keberangkatan:
                        String(
                            row[5] || ""
                        ).trim()

                });

            }
        );


        stations = [
            ...new Set(

                database
                    .flatMap(item => [
                        item.asal,
                        item.tujuan
                    ])

            )
        ]
        .filter(Boolean)
        .sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    "id"
                )
        );


        if (!database.length) {

            throw new Error(
                "Database terbaca, tetapi tidak ada baris tarif yang valid."
            );

        }


        status.textContent =
            database.length +
            " data tarif";


        empty.classList.add(
            "active"
        );


        console.log(
            "Database berhasil dimuat:",
            database
        );


    } catch (error) {

        console.error(
            "Database error:",
            error
        );


        status.textContent =
            "Database gagal dimuat";


        errorBox.textContent =
            "Database tidak dapat dimuat. " +
            error.message +
            " Pastikan Google Sheet dapat diakses publik.";


        errorBox.classList.add(
            "active"
        );


        empty.classList.remove(
            "active"
        );

    }

}


/* =========================
   START DATABASE
========================= */


loadDatabase();
    /* =========================
   AUTOCOMPLETE
========================= */

function showSuggestions(
    input,
    container
) {

    const keyword =
        normalize(input.value);


    container.innerHTML = "";


    if (!keyword) {

        container.style.display =
            "none";

        return;

    }


    const matches =
        stations
            .filter(station =>
                normalize(station)
                    .includes(keyword)
            )
            .slice(0, 8);


    if (!matches.length) {

        container.style.display =
            "none";

        return;

    }


    matches.forEach(station => {

        const item =
            document.createElement("div");


        item.className =
            "suggestion-item";


        item.textContent =
            station;


        item.addEventListener(
            "click",
            () => {

                input.value =
                    station;

                container.style.display =
                    "none";

            }
        );


        container.appendChild(item);

    });


    container.style.display =
        "block";

}


/* =========================
   INPUT EVENTS
========================= */

asalInput.addEventListener(
    "input",
    () => {

        showSuggestions(
            asalInput,
            asalSuggestions
        );

    }
);


tujuanInput.addEventListener(
    "input",
    () => {

        showSuggestions(
            tujuanInput,
            tujuanSuggestions
        );

    }
);


/* =========================
   FOCUS EVENTS
========================= */

asalInput.addEventListener(
    "focus",
    () => {

        if (asalInput.value) {

            showSuggestions(
                asalInput,
                asalSuggestions
            );

        }

    }
);


tujuanInput.addEventListener(
    "focus",
    () => {

        if (tujuanInput.value) {

            showSuggestions(
                tujuanInput,
                tujuanSuggestions
            );

        }

    }
);


/* =========================
   CLOSE SUGGESTIONS
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".field"
            )
        ) {

            asalSuggestions.style.display =
                "none";

            tujuanSuggestions.style.display =
                "none";

        }

    }
);


/* =========================
   SWAP STATION
========================= */

swapBtn.addEventListener(
    "click",
    () => {

        const temporary =
            asalInput.value;


        asalInput.value =
            tujuanInput.value;


        tujuanInput.value =
            temporary;


        asalSuggestions.style.display =
            "none";


        tujuanSuggestions.style.display =
            "none";

    }
);


/* =========================
   FIND DATA
========================= */

function findTarif(
    asal,
    tujuan
) {

    const origin =
        normalize(asal);


    const destination =
        normalize(tujuan);


    return database.filter(
        item =>

            normalize(item.asal)
                === origin &&

            normalize(item.tujuan)
                === destination
    );

}


/* =========================
   GROUP BY TRAIN
========================= */

function groupByTrain(
    data
) {

    const grouped = {};


    data.forEach(item => {

        const train =
            item.kereta;


        if (!grouped[train]) {

            grouped[train] = [];

        }


        grouped[train].push(item);

    });


    return grouped;

}


/* =========================
   CLASS ORDER
========================= */

function classPriority(
    className
) {

    const value =
        normalize(className);


    if (
        value.includes(
            "executive"
        ) ||
        value.includes(
            "eksekutif"
        )
    ) {

        return 1;

    }


    if (
        value.includes(
            "business"
        ) ||
        value.includes(
            "bisnis"
        )
    ) {

        return 2;

    }


    if (
        value.includes(
            "economy"
        ) ||
        value.includes(
            "ekonomi"
        )
    ) {

        return 3;

    }


    return 4;

}


/* =========================
   RENDER RESULT
========================= */

function renderResults(
    data,
    asal,
    tujuan
) {

    results.innerHTML = "";

    resultCount.textContent = "";


    if (!data.length) {

        empty.innerHTML = `

            <strong>
                Tarif tidak ditemukan
            </strong>

            <br><br>

            Belum ada data tarif khusus
            untuk relasi

            <b>
                ${escapeHTML(asal)}
            </b>

            →

            <b>
                ${escapeHTML(tujuan)}
            </b>.

        `;


        empty.classList.add(
            "active"
        );


        return;

    }


    empty.classList.remove(
        "active"
    );


    const grouped =
        groupByTrain(data);


    const trainNames =
        Object.keys(grouped);


    trainNames.forEach(
        (trainName, index) => {

            const items =
                grouped[trainName];


            items.sort(
                (a, b) =>
                    classPriority(a.kelas) -
                    classPriority(b.kelas)
            );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "train-card";


            card.style.animationDelay =
                (index * 80) + "ms";


            const first =
                items[0];


            let fareHTML = "";


            items.forEach(
                item => {

                    fareHTML += `

                        <div class="fare-item">

                            <div class="fare-class">

                                ${escapeHTML(
                                    item.kelas
                                )}

                            </div>

                            <div class="fare-price">

                                ${formatRupiah(
                                    item.tarif
                                )}

                            </div>

                            ${
                                item.keberangkatan
                                ?
                                `
                                <div class="fare-time">

                                    Keberangkatan:
                                    ${escapeHTML(
                                        item.keberangkatan
                                    )}

                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    `;

                }
            );


            card.innerHTML = `

                <div class="train-header">

                    <div>

                        <div class="train-name">

                            ${escapeHTML(
                                trainName
                            )}

                        </div>


                        <div class="route">

                            <span>

                                ${escapeHTML(
                                    first.asal
                                )}

                            </span>


                            <span class="route-line"></span>


                            <span>

                                ${escapeHTML(
                                    first.tujuan
                                )}

                            </span>

                        </div>

                    </div>


                    <div class="availability">

                        ● TERSEDIA

                    </div>

                </div>


                <div class="fare-grid">

                    ${fareHTML}

                </div>

            `;


            results.appendChild(
                card
            );

        }
    );


    resultCount.textContent =
        trainNames.length +
        " kereta • " +
        data.length +
        " tarif ditemukan";

}


/* =========================
   SEARCH
========================= */

function performSearch() {

    const asal =
        asalInput.value.trim();


    const tujuan =
        tujuanInput.value.trim();


    errorBox.classList.remove(
        "active"
    );


    results.innerHTML = "";


    resultCount.textContent = "";


    if (!asal || !tujuan) {

        empty.innerHTML = `

            Silakan isi

            <b>Stasiun Asal</b>

            dan

            <b>Stasiun Tujuan</b>

            terlebih dahulu.

        `;


        empty.classList.add(
            "active"
        );


        return;

    }


    if (
        normalize(asal) ===
        normalize(tujuan)
    ) {

        empty.innerHTML = `

            Stasiun asal dan tujuan
            tidak boleh sama.

        `;


        empty.classList.add(
            "active"
        );


        return;

    }


    loading.classList.add(
        "active"
    );


    empty.classList.remove(
        "active"
    );


    searchBtn.disabled =
        true;


    searchBtn.querySelector(
        "span"
    ).textContent =
        "MENCARI...";


    /*
       Sedikit delay agar
       animasi loading terasa
       lebih smooth.
    */

    setTimeout(
        () => {

            const data =
                findTarif(
                    asal,
                    tujuan
                );


            renderResults(
                data,
                asal,
                tujuan
            );


            loading.classList.remove(
                "active"
            );


            searchBtn.disabled =
                false;


            searchBtn.querySelector(
                "span"
            ).textContent =
                "CARI TARIF";

        },

        350

    );

}


/* =========================
   SEARCH BUTTON
========================= */

searchBtn.addEventListener(
    "click",
    performSearch
);


/* =========================
   ENTER KEY
========================= */

asalInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            performSearch();

        }

    }
);


tujuanInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            performSearch();

        }

    }
);


/* =========================
   INITIAL STATE
========================= */

empty.classList.add(
    "active"
);


/* =========================
   END
========================= */

</script>
