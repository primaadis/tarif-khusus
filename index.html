<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TARSUS FINDER</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #182238 0%,
                    #0b101b 38%,
                    #070a10 100%
                );

            color: #eef3ff;

            min-height: 100vh;
        }


        /* =========================================
           HEADER
           ========================================= */

        header {

            padding: 30px 20px 20px;

            text-align: center;
        }


        .brand {

            display: inline-flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 8px;
        }


        .brand-mark {

            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #6f8cff,
                    #a96dff
                );

            box-shadow:
                0 10px 30px rgba(
                    102,
                    126,
                    234,
                    .25
                );

            font-weight: 900;

            font-size: 18px;
        }


        h1 {

            margin: 0;

            font-size: 27px;

            letter-spacing: 1.5px;

            font-weight: 850;
        }


        .subtitle {

            margin: 8px 0 0;

            color: #8f9ab1;

            font-size: 13px;

            letter-spacing: .3px;
        }


        /* =========================================
           MAIN
           ========================================= */

        main {

            width: min(
                980px,
                calc(100% - 28px)
            );

            margin: 15px auto 50px;
        }


        /* =========================================
           SEARCH PANEL
           ========================================= */

        .search-panel {

            background:
                rgba(18, 24, 38, .88);

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .07
                );

            border-radius: 24px;

            padding: 22px;

            box-shadow:
                0 25px 70px rgba(
                    0,
                    0,
                    0,
                    .3
                );

            backdrop-filter: blur(18px);
        }


        .search-grid {

            display: grid;

            grid-template-columns:
                1fr
                60px
                1fr;

            gap: 12px;

            align-items: end;
        }


        .field {

            position: relative;
        }


        .field label {

            display: block;

            margin: 0 0 8px 4px;

            font-size: 11px;

            color: #7f8ba3;

            letter-spacing: 1.2px;

            font-weight: 800;
        }


        .input-wrap {

            position: relative;
        }


        input {

            width: 100%;

            height: 56px;

            padding:
                0 17px;

            border-radius: 15px;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .08
                );

            outline: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .045
                );

            color: #fff;

            font-size: 15px;

            transition:
                .2s ease;
        }


        input::placeholder {
            color: #59657c;
        }


        input:focus {

            border-color:
                rgba(
                    126,
                    148,
                    255,
                    .7
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    .065
                );

            box-shadow:
                0 0 0 4px
                rgba(
                    111,
                    140,
                    255,
                    .08
                );
        }


        /* =========================================
           AUTOCOMPLETE
           ========================================= */

        .suggestions {

            position: absolute;

            z-index: 50;

            left: 0;
            right: 0;

            top: calc(100% + 7px);

            background: #141b2a;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .09
                );

            border-radius: 14px;

            overflow: hidden;

            display: none;

            box-shadow:
                0 20px 40px rgba(
                    0,
                    0,
                    0,
                    .4
                );
        }


        .suggestions.show {
            display: block;
        }


        .autocomplete-item {

            padding:
                12px 14px;

            cursor: pointer;

            border-bottom:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .045
                );

            transition:
                background .15s ease;
        }


        .autocomplete-item:last-child {
            border-bottom: 0;
        }


        .autocomplete-item:hover {

            background:
                rgba(
                    111,
                    140,
                    255,
                    .12
                );
        }


        .autocomplete-item strong {

            display: block;

            font-size: 14px;

            color: #f4f6ff;
        }


        .autocomplete-item small {

            display: block;

            margin-top: 3px;

            font-size: 11px;

            color: #78849b;
        }


        /* =========================================
           SWAP
           ========================================= */

        .swap-wrap {

            display: flex;

            justify-content: center;

            align-items: center;

            padding-bottom: 5px;
        }


        #swapBtn {

            width: 46px;
            height: 46px;

            border-radius: 50%;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .09
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    .045
                );

            color: #aebcff;

            cursor: pointer;

            font-size: 19px;

            transition:
                .2s ease;
        }


        #swapBtn:hover {

            transform:
                rotate(180deg);

            background:
                rgba(
                    111,
                    140,
                    255,
                    .13
                );
        }


        /* =========================================
           SEARCH BUTTON
           ========================================= */

        #searchBtn {

            width: 100%;

            height: 56px;

            margin-top: 15px;

            border: 0;

            border-radius: 15px;

            cursor: pointer;

            color: #fff;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: .6px;

            background:
                linear-gradient(
                    135deg,
                    #657fff,
                    #9b6cf5
                );

            box-shadow:
                0 12px 30px
                rgba(
                    100,
                    119,
                    255,
                    .22
                );

            transition:
                .2s ease;
        }


        #searchBtn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 16px 35px
                rgba(
                    100,
                    119,
                    255,
                    .3
                );
        }


        #searchBtn:active {
            transform: translateY(1px);
        }


        /* =========================================
           STATUS
           ========================================= */

        #status {

            min-height: 20px;

            margin-top: 13px;

            text-align: center;

            font-size: 12px;

            color: #69758d;
        }


        #status.success {
            color: #74d7a3;
        }


        #status.error {
            color: #ff8585;
        }


        #status.loading {
            color: #9eaeff;
        }


        /* =========================================
           RESULTS
           ========================================= */

        #results {

            margin-top: 22px;
        }


        .result-card {

            overflow: hidden;

            margin-bottom: 18px;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .07
                );

            border-radius: 22px;

            background:
                rgba(
                    17,
                    23,
                    36,
                    .9
                );

            box-shadow:
                0 20px 55px rgba(
                    0,
                    0,
                    0,
                    .22
                );
        }


        .result-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            padding: 20px 21px 15px;

            border-bottom:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .055
                );
        }


        .train-label {

            color: #69758c;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.5px;

            margin-bottom: 4px;
        }


        .train-name {

            margin: 0;

            font-size: 21px;

            font-weight: 850;

            letter-spacing: .2px;
        }


        .direction-badge {

            padding:
                7px 11px;

            border-radius: 10px;

            background:
                rgba(
                    111,
                    140,
                    255,
                    .1
                );

            color: #aab8ff;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .8px;
        }


        /* =========================================
           SEARCH ROUTE
           ========================================= */

        .search-route {

            display: grid;

            grid-template-columns:
                1fr
                50px
                1fr;

            align-items: center;

            padding:
                18px 21px;
        }


        .station-point small {

            display: block;

            color: #657188;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.2px;

            margin-bottom: 5px;
        }


        .station-point strong {

            font-size: 17px;

            color: #f0f3fb;
        }


        .big-arrow {

            text-align: center;

            font-size: 22px;

            color: #7687c9;
        }


        /* =========================================
           OFFICIAL RELATION
           ========================================= */

        .official-relation {

            margin:
                0 21px 17px;

            padding:
                14px 15px;

            border-radius: 14px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .035
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .055
                );
        }


        .relation-label {

            display: block;

            margin-bottom: 5px;

            color: #68748a;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.1px;
        }


        .official-relation strong {

            font-size: 14px;

            color: #dbe2ff;

        }


        /* =========================================
           ROUTE BOX
           ========================================= */

        .route-box {

            margin:
                0 21px 18px;

            padding:
                13px 14px;

            border-radius: 14px;

            background:
                rgba(
                    7,
                    10,
                    17,
                    .45
                );
        }


        .route-title {

            margin-bottom: 9px;

            color: #68748a;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.1px;
        }


        .route-list {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 6px;

            line-height: 1.7;
        }


        .route-station {

            color: #a9b3c8;

            font-size: 11px;
        }


        .route-origin {

            color: #82cfff;

            font-weight: 800;
        }


        .route-destination {

            color: #9eaeff;

            font-weight: 800;
        }


        .route-arrow {

            color: #4e5a70;

            font-size: 13px;
        }


        /* =========================================
           FARES
           ========================================= */

        .fare-title {

            padding:
                0 21px 9px;

            color: #68748a;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.2px;
        }


        .fare-list {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        150px,
                        1fr
                    )
                );

            gap: 8px;

            padding:
                0 21px 18px;
        }


        .fare-item {

            padding:
                13px 14px;

            border-radius: 13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .035
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .045
                );
        }


        .fare-item span {

            display: block;

            margin-bottom: 4px;

            color: #69758a;

            font-size: 10px;

            font-weight: 700;
        }


        .fare-item strong {

            font-size: 15px;

            color: #f0f3ff;
        }


        /* =========================================
           RESULT FOOTER
           ========================================= */

        .result-footer {

            display: flex;

            justify-content: space-between;

            padding:
                11px 21px;

            border-top:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .045
                );

            color: #566177;

            font-size: 10px;
        }


        /* =========================================
           EMPTY RESULT
           ========================================= */

        .empty-result {

            padding:
                50px 25px;

            text-align: center;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    .06
                );

            border-radius: 22px;

            background:
                rgba(
                    17,
                    23,
                    36,
                    .7
                );
        }


        .empty-icon {

            font-size: 38px;

            color: #59657d;

            margin-bottom: 10px;
        }


        .empty-result h3 {

            margin:
                0 0 7px;

            font-size: 17px;
        }


        .empty-result p {

            margin: 0;

            color: #68758c;

            font-size: 12px;

            line-height: 1.7;
        }


        /* =========================================
           FOOTER
           ========================================= */

        footer {

            padding:
                15px 20px 30px;

            text-align: center;

            color: #4e596e;

            font-size: 10px;

            letter-spacing: .3px;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 650px) {

            header {
                padding-top: 22px;
            }


            h1 {
                font-size: 23px;
            }


            .search-panel {
                padding: 16px;
                border-radius: 19px;
            }


            .search-grid {

                grid-template-columns:
                    1fr;

                gap: 9px;
            }


            .swap-wrap {

                padding: 0;

                height: 40px;
            }


            #swapBtn {

                transform: rotate(90deg);
            }


            #swapBtn:hover {

                transform:
                    rotate(270deg);
            }


            .search-route {

                grid-template-columns:
                    1fr
                    35px
                    1fr;

                padding:
                    16px;
            }


            .station-point strong {
                font-size: 14px;
            }


            .big-arrow {
                font-size: 18px;
            }


            .result-top {
                padding:
                    17px 16px 13px;
            }


            .result-name {
                font-size: 18px;
            }


            .official-relation,
            .route-box {
                margin-left: 16px;
                margin-right: 16px;
            }


            .fare-title {
                padding-left: 16px;
                padding-right: 16px;
            }


            .fare-list {
                padding-left: 16px;
                padding-right: 16px;
            }


            .result-footer {
                padding:
                    10px 16px;
            }
        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <div class="brand-mark">
            TF
        </div>

        <h1>
            TARSUS FINDER
        </h1>

    </div>

    <p class="subtitle">
        Mesin pencarian tarif khusus kereta api
    </p>

</header>


<main>


    <section class="search-panel">

        <div class="search-grid">


            <!-- ASAL -->

            <div class="field">

                <label>
                    STASIUN ASAL
                </label>

                <div class="input-wrap">

                    <input
                        id="asal"
                        type="text"
                        autocomplete="off"
                        placeholder="Contoh: Bekasi"
                    >

                    <div
                        id="asal-suggestions"
                        class="suggestions"
                    ></div>

                </div>

            </div>


            <!-- SWAP -->

            <div class="swap-wrap">

                <button
                    id="swapBtn"
                    type="button"
                    title="Tukar asal dan tujuan"
                >
                    ⇄
                </button>

            </div>


            <!-- TUJUAN -->

            <div class="field">

                <label>
                    STASIUN TUJUAN
                </label>

                <div class="input-wrap">

                    <input
                        id="tujuan"
                        type="text"
                        autocomplete="off"
                        placeholder="Contoh: Gambir"
                    >

                    <div
                        id="tujuan-suggestions"
                        class="suggestions"
                    ></div>

                </div>

            </div>

        </div>


        <button
            id="searchBtn"
            type="button"
        >
            CARI TARIF KHUSUS
        </button>


        <div
            id="status"
            class="status"
        >
            Memuat database...
        </div>

    </section>


    <section id="results"></section>


</main>


<footer>

    TARSUS FINDER
    ·
    Database tarif khusus berbasis Google Sheets

</footer>


<script src="data.js"></script>

</body>

</html>
