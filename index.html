<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARSUS Finder</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef4f9;
    color: #10243a;
    min-height: 100vh;
}

.hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 55px 20px 125px;
    background:
        radial-gradient(circle at 20% 20%, rgba(60,150,220,.18), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(80,180,255,.12), transparent 35%),
        linear-gradient(135deg, #071a2e, #0b2945 55%, #071a2e);
    color: white;
}

.hero::before {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: rgba(64, 177, 255, .08);
    filter: blur(15px);
    top: -100px;
    left: -80px;
    animation: floatGlow 6s ease-in-out infinite;
}

.hero::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(40, 130, 220, .07);
    filter: blur(20px);
    bottom: -170px;
    right: -100px;
    animation: floatGlow 8s ease-in-out infinite reverse;
}

@keyframes floatGlow {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(20px,15px);
    }
}

.identity {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}

.brand-kai,
.brand-121 {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
}

.brand-kai {
    color: #ffffff;
}

.brand-121 {
    color: #8ecbff;
}

.brand-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #58bdf2;
    box-shadow: 0 0 10px rgba(88,189,242,.8);
}

.eyebrow {
    position: relative;
    z-index: 2;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 800;
    color: #8ecbff;
    margin-bottom: 8px;
}

.hero h1 {
    position: relative;
    z-index: 2;
    font-size: clamp(38px, 9vw, 62px);
    font-weight: 900;
    letter-spacing: -2px;
    color: #ffffff;
}

.hero h1 span {
    color: #8ecbff;
}

.hero p {
    position: relative;
    z-index: 2;
    max-width: 430px;
    margin: 14px auto 0;
    color: #a9bdd2;
    font-size: 14px;
    line-height: 1.7;
}

.creator {
    position: relative;
    z-index: 2;
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #7189a3;
    text-transform: uppercase;
}

.creator strong {
    color: #b9d9f5;
    font-weight: 800;
}

/* RAIL DECORATION */

.rail {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 25px;
    height: 28px;
    opacity: .35;
}

.rail::before,
.rail::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: #9fc7e5;
}

.rail::before {
    top: 5px;
}

.rail::after {
    bottom: 5px;
}

.sleepers {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.sleeper {
    width: 9px;
    height: 30px;
    background: #7895ad;
    transform: rotate(0deg);
}

/* SEARCH CARD */

.search-card {
    position: relative;
    z-index: 10;
    width: min(92%, 850px);
    margin: -80px auto 0;
    background: rgba(255,255,255,.97);
    border-radius: 22px;
    padding: 24px;
    box-shadow:
        0 20px 50px rgba(8,35,60,.15),
        0 5px 15px rgba(8,35,60,.08);
    animation: cardIn .7s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.search-row {
    display: grid;
    grid-template-columns: 1fr 55px 1fr;
    gap: 12px;
    align-items: center;
}

.input-box {
    position: relative;
}

.input-box label {
    display: block;
    text-align: left;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #71869b;
    margin: 0 0 7px 5px;
    text-transform: uppercase;
}

.input-box input {
    width: 100%;
    height: 50px;
    border: 1px solid #d7e2ec;
    border-radius: 13px;
    padding: 0 15px;
    font-size: 14px;
    outline: none;
    color: #17314b;
    background: #f8fbfd;
    transition: .25s;
}

.input-box input:focus {
    border-color: #4da9e8;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(77,169,232,.1);
}

.swap-btn {
    width: 46px;
    height: 46px;
    margin-top: 18px;
    border: none;
    border-radius: 50%;
    background: #0b2945;
    color: white;
    font-size: 21px;
    cursor: pointer;
    transition: .25s;
}

.swap-btn:hover {
    transform: rotate(180deg);
    background: #12456e;
}

.suggestion-box {
    position: absolute;
    top: 78px;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #dce7ef;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(10,40,65,.15);
    overflow: hidden;
    display: none;
    z-index: 100;
}

.suggestion-item {
    padding: 12px 15px;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: .15s;
}

.suggestion-item:hover {
    background: #edf7ff;
    color: #0c6aa5;
}

.search-btn {
    width: 100%;
    height: 52px;
    margin-top: 18px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#0b2945,#125d8d);
    color: white;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: .25s;
}

.search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(12,83,130,.25);
}

.search-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );
    transform: skewX(-20deg);
    animation: shine 3s infinite;
}

@keyframes shine {
    0% {
        left: -100%;
    }

    35%,100% {
        left: 140%;
    }
}

/* RESULT */

.result-section {
    width: min(92%, 850px);
    margin: 35px auto 60px;
}

.result-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.result-title h2 {
    font-size: 18px;
    color: #17314b;
}

.result-count {
    font-size: 11px;
    color: #7a8fa3;
}

#result {
    display: grid;
    gap: 15px;
}

.empty {
    background: white;
    border-radius: 17px;
    padding: 30px 20px;
    text-align: center;
    color: #8295a6;
    box-shadow: 0 8px 25px rgba(10,40,65,.07);
}

.result-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(10,40,65,.09);
    animation: resultIn .5s ease both;
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.train-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.train-name {
    font-size: 18px;
    font-weight: 900;
    color: #102f4b;
}

.available {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #14814b;
    background: #e9f8f0;
    border-radius: 20px;
    padding: 6px 9px;
}

.route {
    margin: 12px 0 18px;
    font-size: 13px;
    color: #71879b;
}

.route span {
    color: #aac0d0;
    padding: 0 7px;
}

.price-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
}

.price-box {
    background: #f5f9fc;
    border-radius: 12px;
    padding: 12px;
}

.price-class {
    font-size: 9px;
    font-weight: 800;
    color: #7c91a4;
    letter-spacing: .7px;
}

.price {
    margin-top: 5px;
    font-size: 15px;
    font-weight: 900;
    color: #103b5e;
}

.departure {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #edf1f4;
    font-size: 11px;
    color: #71879b;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #6d8295;
}

@media(max-width:600px) {

    .hero {
        padding: 45px 18px 115px;
    }

    .hero h1 {
        font-size: 42px;
    }

    .hero p {
        font-size: 13px;
    }

    .search-card {
        padding: 18px;
        border-radius: 18px;
    }

    .search-row {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .swap-btn {
        margin: 3px auto;
        transform: rotate(90deg);
    }

    .swap-btn:hover {
        transform: rotate(270deg);
    }

    .price-grid {
        grid-template-columns: 1fr;
    }

    .train-top {
        align-items: flex-start;
    }

}

</style>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/1a4Ln_wASazV35F2M3MKZcJHEmiAV8G-0WmkMmU4Csls/gviz/tq?tqx=out:csv&sheet=Tarif%20Khusus";


let database = [];
let stations = [];


/* =========================
   CSV PARSER
========================= */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {

            cell += '"';
            i++;
            continue;
        }

        if (char === '"') {

            insideQuotes = !insideQuotes;
            continue;
        }

        if (char === "," && !insideQuotes) {

            row.push(cell);
            cell = "";
            continue;
        }

        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell);

            if (row.some(value => value.trim() !== "")) {
                rows.push(row);
            }

            row = [];
            cell = "";

            continue;
        }

        cell += char;
    }

    if (cell !== "" || row.length > 0) {

        row.push(cell);

        if (row.some(value => value.trim() !== "")) {
            rows.push(row);
        }
    }

    return rows;
}


/* =========================
   LOAD DATABASE
========================= */

async function loadDatabase() {

    try {

        const response = await fetch(
            CSV_URL + "&t=" + Date.now()
        );

        const text = await response.text();

        const rows = parseCSV(text);

        database = rows
            .slice(1)
            .map(row => {

                return {

                    kereta:
                        row[0]?.trim() || "",

                    stasiunAsal:
                        row[1]?.trim() || "",

                    stasiunTujuan:
                        row[2]?.trim() || "",

                    kelas:
                        row[3]?.trim() || "",

                    tarif:
                        Number(
                            String(row[4] || "")
                            .replace(/[^\d]/g, "")
                        ),

                    jam:
                        row[5]?.trim() || "",

                    keberangkatan:
                        row[5]?.trim() || ""

                };

            })
            .filter(item =>
                item.kereta &&
                item.stasiunAsal &&
                item.stasiunTujuan
            );


        createStationList();

        console.log(
            "Database berhasil dimuat:",
            database.length,
            "data"
        );

    }

    catch (error) {

        console.error(
            "Gagal mengambil database:",
            error
        );

        document.getElementById("result").innerHTML = `

            <div class="empty">

                Gagal mengambil data tarif.
                <br><br>

                Pastikan Google Sheet
                dapat diakses secara publik.

            </div>

        `;

    }

}


/* =========================
   STATION LIST
========================= */

function createStationList() {

    const set = new Set();

    database.forEach(item => {

        if (item.stasiunAsal) {
            set.add(item.stasiunAsal);
        }

        if (item.stasiunTujuan) {
            set.add(item.stasiunTujuan);
        }

    });

    stations = Array.from(set)
        .sort((a, b) =>
            a.localeCompare(b, "id")
        );

}


/* =========================
   AUTOCOMPLETE
========================= */

function setupAutocomplete(
    inputId,
    suggestionId
) {

    const input =
        document.getElementById(inputId);

    const box =
        document.getElementById(suggestionId);


    input.addEventListener(
        "input",
        function () {

            const keyword =
                input.value
                    .trim()
                    .toLowerCase();


            box.innerHTML = "";


            if (!keyword) {

                box.style.display = "none";

                return;
            }


            const matches =
                stations
                    .filter(station =>
                        station
                            .toLowerCase()
                            .includes(keyword)
                    )
                    .slice(0, 8);


            if (!matches.length) {

                box.style.display = "none";

                return;
            }


            matches.forEach(station => {

                const item =
                    document.createElement("div");

                item.className =
                    "suggestion-item";

                item.textContent =
                    station;


                item.addEventListener(
                    "click",
                    function () {

                        input.value =
                            station;

                        box.style.display =
                            "none";

                    }
                );


                box.appendChild(item);

            });


            box.style.display = "block";

        }
    );


    input.addEventListener(
        "focus",
        function () {

            if (!input.value.trim()) {
                box.style.display = "none";
            }

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                !input.contains(event.target) &&
                !box.contains(event.target)
            ) {

                box.style.display =
                    "none";

            }

        }
    );

}


/* =========================
   INITIALIZE AUTOCOMPLETE
========================= */

setupAutocomplete(
    "asal",
    "asalSuggestions"
);

setupAutocomplete(
    "tujuan",
    "tujuanSuggestions"
);


/* =========================
   SWAP STATION
========================= */

document
    .getElementById("swapBtn")
    .addEventListener(
        "click",
        function () {

            const asal =
                document.getElementById("asal");

            const tujuan =
                document.getElementById("tujuan");


            const temp =
                asal.value;

            asal.value =
                tujuan.value;

            tujuan.value =
                temp;

        }
    );


/* =========================
   FORMAT RUPIAH
========================= */

function formatRupiah(number) {

    if (!number) {
        return "-";
    }

    return new Intl.NumberFormat(
        "id-ID"
    ).format(number);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   SEARCH BUTTON
========================= */

document
    .getElementById("searchBtn")
    .addEventListener(
        "click",
        searchTarif
    );


/* =========================
   ENTER KEY SEARCH
========================= */

document
    .getElementById("asal")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                searchTarif();
            }

        }
    );


document
    .getElementById("tujuan")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                searchTarif();
            }

        }
    );


/* =========================
   LOAD DATABASE
========================= */

loadDatabase();

              </script>
              <script>

/* =========================
   SEARCH TARIF
========================= */

function searchTarif() {

    const asal =
        document
        .getElementById("asal")
        .value
        .trim();

    const tujuan =
        document
        .getElementById("tujuan")
        .value
        .trim();

    const result =
        document.getElementById("result");

    const resultCount =
        document.getElementById("resultCount");


    /* VALIDASI */

    if (!asal || !tujuan) {

        result.innerHTML = `

            <div class="empty">

                Silakan pilih
                <strong>stasiun asal</strong>
                dan
                <strong>stasiun tujuan</strong>.

            </div>

        `;

        resultCount.textContent = "";

        return;
    }


    /* LOADING */

    result.innerHTML = `

        <div class="loading">

            Mencari tarif khusus
            <span class="loading-dots">
                • • •
            </span>

        </div>

    `;


    setTimeout(() => {

        const asalLower =
            asal.toLowerCase();

        const tujuanLower =
            tujuan.toLowerCase();


        /* =========================
           FILTER DATA
        ========================= */

        const data =
            database.filter(item => {

                const itemAsal =
                    item.stasiunAsal
                    .toLowerCase();

                const itemTujuan =
                    item.stasiunTujuan
                    .toLowerCase();


                return (
                    itemAsal === asalLower &&
                    itemTujuan === tujuanLower
                );

            });


        /* =========================
           TIDAK DITEMUKAN
        ========================= */

        if (!data.length) {

            result.innerHTML = `

                <div class="empty">

                    <div style="
                        font-size:32px;
                        margin-bottom:10px;
                    ">
                        🚆
                    </div>

                    <strong>
                        Tarif khusus tidak ditemukan
                    </strong>

                    <br><br>

                    <span style="
                        font-size:12px;
                    ">

                        ${escapeHTML(asal)}
                        →
                        ${escapeHTML(tujuan)}

                    </span>

                    <br><br>

                    <span style="
                        font-size:11px;
                        color:#8da0b0;
                    ">

                        Coba periksa kembali
                        nama stasiun atau
                        pilih dari daftar saran.

                    </span>

                </div>

            `;

            resultCount.textContent =
                "0 data";

            return;
        }


        /* =========================
           GROUP BERDASARKAN KERETA
        ========================= */

        const grouped = {};


        data.forEach(item => {

            if (!grouped[item.kereta]) {

                grouped[item.kereta] = {

                    kereta:
                        item.kereta,

                    asal:
                        item.stasiunAsal,

                    tujuan:
                        item.stasiunTujuan,

                    eksekutif:
                        null,

                    bisnis:
                        null,

                    ekonomi:
                        null,

                    jam:
                        item.jam ||
                        item.keberangkatan ||
                        "-"

                };

            }


            const kelas =
                item.kelas
                .toLowerCase();


            if (
                kelas.includes("eksekutif")
            ) {

                grouped[item.kereta]
                    .eksekutif =
                    item.tarif;

            }


            else if (
                kelas.includes("bisnis")
            ) {

                grouped[item.kereta]
                    .bisnis =
                    item.tarif;

            }


            else if (
                kelas.includes("ekonomi")
            ) {

                grouped[item.kereta]
                    .ekonomi =
                    item.tarif;

            }


            if (
                item.jam ||
                item.keberangkatan
            ) {

                grouped[item.kereta].jam =
                    item.jam ||
                    item.keberangkatan;

            }

        });


        const trains =
            Object.values(grouped);


        /* =========================
           RESULT COUNT
        ========================= */

        resultCount.textContent =
            trains.length +
            (
                trains.length === 1
                    ? " kereta"
                    : " kereta"
            );


        /* =========================
           DISPLAY RESULT
        ========================= */

        result.innerHTML =
            trains
            .map((train, index) => {

                return `

                    <div
                        class="result-card"
                        style="
                            animation-delay:
                            ${index * 80}ms;
                        "
                    >

                        <div class="train-top">

                            <div class="train-name">

                                ${escapeHTML(
                                    train.kereta
                                )}

                            </div>

                            <div class="available">

                                ● TERSEDIA

                            </div>

                        </div>


                        <div class="route">

                            ${escapeHTML(
                                train.asal
                            )}

                            <span>→</span>

                            ${escapeHTML(
                                train.tujuan
                            )}

                        </div>


                        <div class="price-grid">


                            <div class="price-box">

                                <div class="price-class">

                                    EKSEKUTIF

                                </div>

                                <div class="price">

                                    ${
                                        train.eksekutif
                                            ? "Rp " +
                                              formatRupiah(
                                                  train.eksekutif
                                              )
                                            : "-"
                                    }

                                </div>

                            </div>


                            <div class="price-box">

                                <div class="price-class">

                                    BISNIS

                                </div>

                                <div class="price">

                                    ${
                                        train.bisnis
                                            ? "Rp " +
                                              formatRupiah(
                                                  train.bisnis
                                              )
                                            : "-"
                                    }

                                </div>

                            </div>


                            <div class="price-box">

                                <div class="price-class">

                                    EKONOMI

                                </div>

                                <div class="price">

                                    ${
                                        train.ekonomi
                                            ? "Rp " +
                                              formatRupiah(
                                                  train.ekonomi
                                              )
                                            : "-"
                                    }

                                </div>

                            </div>


                        </div>


                        <div class="departure">

                            🕐 Keberangkatan:

                            <strong>

                                ${escapeHTML(
                                    train.jam || "-"
                                )}

                            </strong>

                        </div>

                    </div>

                `;

            })
            .join("");


    }, 350);

}
