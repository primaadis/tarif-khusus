<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rail Fare Finder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #172033;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HERO */

    .hero {
      position: relative;
      height: 330px;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(66, 153, 225, 0.22),
          transparent 32%
        ),
        radial-gradient(
          circle at 10% 80%,
          rgba(0, 198, 255, 0.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #071426,
          #0b1f3a 55%,
          #102b4d
        );
      color: white;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(45, 156, 219, 0.12);
      filter: blur(10px);
      top: -130px;
      right: -80px;
      animation: floatingGlow 6s ease-in-out infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(0, 200, 255, 0.07);
      filter: blur(20px);
      bottom: -130px;
      left: -80px;
      animation: floatingGlow 7s ease-in-out infinite reverse;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: auto;
      padding: 55px 20px 0;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8ecbff;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #b8c8dc;
      font-size: 14px;
      line-height: 1.6;
      max-width: 500px;
      margin: auto;
    }

    /* RAIL */

    .rail {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 20px;
      height: 45px;
      opacity: 0.18;
      transform: rotate(-2deg);
    }

    .rail::before,
    .rail::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: #9edcff;
    }

    .rail::before {
      top: 10px;
    }

    .rail::after {
      bottom: 10px;
    }

    .sleepers {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 30px,
        rgba(158, 220, 255, 0.7) 31px,
        rgba(158, 220, 255, 0.7) 36px,
        transparent 37px,
        transparent 65px
      );
    }

    /* SEARCH CARD */

    .search-wrapper {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: -75px auto 0;
      padding: 0 16px;
    }

    .search-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 22px;
      padding: 22px;
      box-shadow:
        0 18px 50px rgba(8, 25, 50, 0.15),
        0 4px 12px rgba(8, 25, 50, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: searchCardIn 0.7s ease-out;
    }

    .search-label {
      font-size: 12px;
      font-weight: bold;
      color: #6b778c;
      margin-bottom: 9px;
      display: block;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 54px 1fr;
      gap: 10px;
      align-items: end;
    }

    .input-group {
      position: relative;
    }

    .input-box {
      width: 100%;
      height: 52px;
      border: 1px solid #dce3eb;
      border-radius: 13px;
      padding: 0 15px;
      outline: none;
      font-size: 14px;
      color: #182235;
      background: #f9fbfd;
      transition: 0.25s ease;
    }

    .input-box:focus {
      border-color: #298bdc;
      background: white;
      box-shadow: 0 0 0 4px rgba(41, 139, 220, 0.09);
    }

    .input-box::placeholder {
      color: #9aa5b5;
    }

    .swap-btn {
      width: 54px;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: #edf5fc;
      color: #176aa8;
      font-size: 22px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .swap-btn:hover {
      background: #dceefb;
      transform: rotate(180deg);
    }

    .swap-btn:active {
      transform: scale(0.92) rotate(180deg);
    }

    .search-button {
      width: 100%;
      height: 52px;
      margin-top: 14px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        #1268a8,
        #1594d1
      );
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(21, 148, 209, 0.22);
      transition: 0.25s ease;
    }

    .search-button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transform: skewX(-20deg);
      animation: buttonShine 3.5s infinite;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 25px rgba(21, 148, 209, 0.28);
    }

    .search-button:active {
      transform: translateY(0) scale(0.99);
    }

    /* AUTOCOMPLETE */

    .suggestions {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      background: white;
      border: 1px solid #e2e7ee;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(15, 30, 50, 0.13);
      z-index: 100;
      display: none;
      max-height: 220px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 12px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #273449;
      border-bottom: 1px solid #f0f2f5;
      transition: 0.15s ease;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: #f1f8fd;
      color: #106ca8;
    }
        /* CONTENT */

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 38px 16px 60px;
    }

    .section-heading {
      margin-bottom: 17px;
    }

    .section-heading small {
      display: block;
      color: #8290a3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .section-heading h2 {
      font-size: 21px;
      color: #152137;
    }

    #status {
      font-size: 13px;
      color: #7b8798;
      margin-bottom: 15px;
      min-height: 18px;
    }

    /* RESULT CARD */

    .results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .result-card {
      background: white;
      border-radius: 18px;
      border: 1px solid #e6ebf0;
      box-shadow: 0 7px 22px rgba(22, 38, 60, 0.07);
      padding: 19px;
      animation: cardIn 0.5s ease both;
      transition: 0.25s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 28px rgba(22, 38, 60, 0.10);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .train-name {
      font-size: 17px;
      font-weight: bold;
      color: #13233a;
    }

    .available-badge {
      flex-shrink: 0;
      padding: 6px 9px;
      border-radius: 30px;
      background: #eaf8f0;
      color: #16804a;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #58677b;
      margin-bottom: 17px;
      flex-wrap: wrap;
    }

    .route-arrow {
      color: #1994d0;
      font-weight: bold;
    }

    .price-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #edf0f4;
      border-bottom: 1px solid #edf0f4;
      margin-bottom: 14px;
    }

    .price-item {
      padding: 13px 7px;
      text-align: center;
      border-right: 1px solid #edf0f4;
    }

    .price-item:last-child {
      border-right: none;
    }

    .price-label {
      font-size: 9px;
      color: #8b97a8;
      letter-spacing: 0.7px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .price {
      font-size: 14px;
      color: #17263c;
      font-weight: bold;
    }

    .departure {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8995a6;
    }

    .departure strong {
      font-size: 15px;
      color: #18283f;
    }

    /* EMPTY STATE */

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      background: white;
      border-radius: 18px;
      border: 1px solid #e6ebf0;
      color: #7c8999;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.65;
    }

    .empty-state h3 {
      color: #334158;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .empty-state p {
      font-size: 12px;
      line-height: 1.6;
    }

    /* LOADING */

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      padding: 25px;
      color: #7d8a9d;
      font-size: 13px;
    }

    .loading-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2196d2;
      animation: loadingDot 1s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* ANIMATIONS */

    @keyframes floatingGlow {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(15px) scale(1.05);
      }
    }

    @keyframes searchCardIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonShine {
      0% {
        left: -100%;
      }

      45%, 100% {
        left: 150%;
      }
    }

    @keyframes loadingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .hero {
        height: 300px;
      }

      .hero-content {
        padding-top: 45px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .hero p {
        font-size: 13px;
      }

      .search-wrapper {
        margin-top: -65px;
      }

      .search-card {
        padding: 17px;
        border-radius: 18px;
      }

      .search-row {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .swap-btn {
        width: 100%;
        height: 38px;
        font-size: 19px;
      }

      .swap-btn:hover {
        transform: none;
      }

      .swap-btn:active {
        transform: scale(0.98);
      }

      .input-box {
        height: 50px;
      }

      .search-button {
        height: 50px;
      }

      .content {
        padding-top: 32px;
      }

      .result-card {
        padding: 16px;
      }

      .train-name {
        font-size: 15px;
      }

      .route {
        font-size: 12px;
      }

      .price {
        font-size: 13px;
      }

      .price-label {
        font-size: 8px;
      }
    }

    @media (max-width: 380px) {

      .hero h1 {
        font-size: 26px;
      }

      .result-top {
        align-items: flex-start;
      }

      .available-badge {
        font-size: 9px;
        padding: 5px 7px;
      }

      .price-item {
        padding-left: 3px;
        padding-right: 3px;
      }
    }

  </style>
</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <div class="hero-content">

      <span class="eyebrow">
        Railway Fare Search
      </span>

      <h1>
        Rail Fare Finder
      </h1>

      <p>
        Cari informasi tarif khusus kereta dengan cepat,
        sederhana, dan nyaman.
      </p>

    </div>

    <div class="rail">
      <div class="sleepers"></div>
    </div>

  </section>


  <!-- SEARCH -->

  <div class="search-wrapper">

    <div class="search-card">

      <label class="search-label">
        CARI RELASI PERJALANAN
      </label>

      <div class="search-row">

        <div class="input-group">

          <input
            type="text"
            id="asal"
            class="input-box"
            placeholder="Stasiun asal"
            autocomplete="off"
          >

          <div
            id="suggestionsAsal"
            class="suggestions">
          </div>

        </div>


        <button
          type="button"
          class="swap-btn"
          id="swapBtn"
          title="Tukar stasiun"
        >
          ⇅
        </button>


        <div class="input-group">

          <input
            type="text"
            id="tujuan"
            class="input-box"
            placeholder="Stasiun tujuan"
            autocomplete="off"
          >

          <div
            id="suggestionsTujuan"
            class="suggestions">
          </div>

        </div>

      </div>


      <button
        type="button"
        id="searchBtn"
        class="search-button"
      >
        CARI TARIF KHUSUS
      </button>

    </div>

  </div>


  <!-- CONTENT -->

  <main class="content">

    <div class="section-heading">

      <small>
        HASIL PENCARIAN
      </small>

      <h2>
        Tarif Khusus
      </h2>

    </div>

    <div id="status"></div>

    <div
      id="results"
      class="results"
    >

      <div class="empty-state">

        <div class="empty-icon">
          🚆
        </div>

        <h3>
          Cari tarif perjalanan
        </h3>

        <p>
          Pilih stasiun asal dan tujuan,
          kemudian tekan tombol cari.
        </p>

      </div>

    </div>

  </main>


  <script>
        const CSV_URL =
      "https://docs.google.com/spreadsheets/d/1a4Ln_wASazV35F2M3MKZcJHEmiAV8G-0WmkMmU4Csls/gviz/tq?tqx=out:csv&sheet=Tarif%20Khusus";


    const asalInput = document.getElementById("asal");
    const tujuanInput = document.getElementById("tujuan");

    const suggestionsAsal =
      document.getElementById("suggestionsAsal");

    const suggestionsTujuan =
      document.getElementById("suggestionsTujuan");

    const swapBtn =
      document.getElementById("swapBtn");

    const searchBtn =
      document.getElementById("searchBtn");

    const results =
      document.getElementById("results");

    const status =
      document.getElementById("status");


    let database = [];
    let stations = [];


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       FORMAT RUPIAH
    ========================= */

    function formatRupiah(value) {

      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number(value) === 0
      ) {
        return "-";
      }

      return "Rp " +
        Number(value).toLocaleString("id-ID");

    }


    /* =========================
       PARSE CSV
    ========================= */

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"' && insideQuotes && next === '"') {

          cell += '"';

          i++;

        }

        else if (char === '"') {

          insideQuotes = !insideQuotes;

        }

        else if (char === "," && !insideQuotes) {

          row.push(cell);

          cell = "";

        }

        else if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);

          rows.push(row);

          row = [];

          cell = "";

        }

        else {

          cell += char;

        }

      }


      if (cell !== "" || row.length > 0) {

        row.push(cell);

        rows.push(row);

      }


      return rows;

    }


    /* =========================
       LOAD DATA
    ========================= */

    async function loadData() {

      try {

        status.textContent =
          "Memuat data tarif khusus...";


        const response =
          await fetch(CSV_URL);


        if (!response.ok) {

          throw new Error(
            "Gagal mengambil data."
          );

        }


        const csv =
          await response.text();


        const rows =
          parseCSV(csv);


        database =
          rows
            .slice(1)
            .filter(row =>
              row.some(cell =>
                String(cell).trim() !== ""
              )
            )
            .map(row => {

              return {

                kereta:
                  row[0]?.trim() || "",

                stasiunAsal:
                  row[1]?.trim() || "",

                stasiunTujuan:
                  row[2]?.trim() || "",

                kelas:
                  row[3]?.trim() || "",

                tarif:
                  Number(
                    String(row[4] || "")
                      .replace(/[^\d]/g, "")
                  ),

                jam:
                  row[5]?.trim() || "",

                keberangkatan:
                  row[5]?.trim() || ""

              };

            });


        buildStationList();


        status.textContent =
          `${database.length} data tarif berhasil dimuat.`;


      }

      catch (error) {

        console.error(error);


        status.textContent =
          "Gagal memuat data tarif.";


        results.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Data tidak dapat dimuat
            </h3>

            <p>
              Pastikan Google Sheet dapat diakses
              dan URL CSV sudah benar.
            </p>

          </div>

        `;

      }

    }


    /* =========================
       STATION LIST
    ========================= */

    function buildStationList() {

      const set =
        new Set();


      database.forEach(item => {

        if (item.stasiunAsal) {

          set.add(item.stasiunAsal);

        }

        if (item.stasiunTujuan) {

          set.add(item.stasiunTujuan);

        }

      });


      stations =
        [...set].sort((a, b) =>
          a.localeCompare(b, "id")
        );

    }


    /* =========================
       AUTOCOMPLETE
    ========================= */

    function showSuggestions(
      input,
      container
    ) {

      const keyword =
        input.value
          .trim()
          .toLowerCase();


      if (!keyword) {

        container.style.display =
          "none";

        container.innerHTML =
          "";

        return;

      }


      const matches =
        stations
          .filter(station =>
            station
              .toLowerCase()
              .includes(keyword)
          )
          .slice(0, 8);


      if (!matches.length) {

        container.style.display =
          "none";

        container.innerHTML =
          "";

        return;

      }


      container.innerHTML =
        matches
          .map(station => `

            <div
              class="suggestion-item"
              data-value="${escapeHTML(station)}"
            >
              ${escapeHTML(station)}
            </div>

          `)
          .join("");


      container.style.display =
        "block";


      container
        .querySelectorAll(".suggestion-item")
        .forEach(item => {

          item.addEventListener(
            "click",
            () => {

              input.value =
                item.dataset.value;

              container.style.display =
                "none";

            }
          );

        });

    }


    asalInput.addEventListener(
      "input",
      () => {

        showSuggestions(
          asalInput,
          suggestionsAsal
        );

      }
    );


    tujuanInput.addEventListener(
      "input",
      () => {

        showSuggestions(
          tujuanInput,
          suggestionsTujuan
        );

      }
    );


    /* =========================
       CLOSE SUGGESTIONS
    ========================= */

    document.addEventListener(
      "click",
      event => {

        if (
          !event.target.closest(
            ".input-group"
          )
        ) {

          suggestionsAsal.style.display =
            "none";

          suggestionsTujuan.style.display =
            "none";

        }

      }
    );


    /* =========================
       SWAP
    ========================= */

    swapBtn.addEventListener(
      "click",
      () => {

        const temp =
          asalInput.value;

        asalInput.value =
          tujuanInput.value;

        tujuanInput.value =
          temp;

      }
    );


    /* =========================
       SEARCH
    ========================= */

    searchBtn.addEventListener(
      "click",
      searchFare
    );


    asalInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          searchFare();

        }

      }
    );


    tujuanInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          searchFare();

        }

      }
    );


    function searchFare() {

      const asal =
        asalInput.value.trim();

      const tujuan =
        tujuanInput.value.trim();


      if (!asal || !tujuan) {

        status.textContent =
          "Silakan isi stasiun asal dan tujuan.";


        results.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🚉
            </div>

            <h3>
              Data belum lengkap
            </h3>

            <p>
              Masukkan stasiun asal dan tujuan
              terlebih dahulu.
            </p>

          </div>

        `;

        return;

      }


      if (
        asal.toLowerCase() ===
        tujuan.toLowerCase()
      ) {

        status.textContent =
          "Stasiun asal dan tujuan tidak boleh sama.";


        results.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🔄
            </div>

            <h3>
              Relasi tidak valid
            </h3>

            <p>
              Pilih dua stasiun yang berbeda.
            </p>

          </div>

        `;

        return;

      }


      results.innerHTML = `

        <div class="loading">

          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>

          <span>
            Mencari tarif...
          </span>

        </div>

      `;


      setTimeout(() => {

        const matched =
          database.filter(item => {

            const origin =
              item.stasiunAsal
                .toLowerCase();

            const destination =
              item.stasiunTujuan
                .toLowerCase();

            const searchOrigin =
              asal.toLowerCase();

            const searchDestination =
              tujuan.toLowerCase();


            return (
              origin === searchOrigin &&
              destination === searchDestination
            );

          });


        renderResults(
          matched,
          asal,
          tujuan
        );

      }, 350);

    }


    /* =========================
       RENDER RESULTS
    ========================= */

    function renderResults(
      data,
      asal,
      tujuan
    ) {

      if (!data.length) {

        status.textContent =
          "Tidak ditemukan tarif khusus untuk relasi tersebut.";


        results.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🔎
            </div>

            <h3>
              Tarif tidak ditemukan
            </h3>

            <p>
              Belum ada data tarif khusus
              untuk relasi
              <strong>
                ${escapeHTML(asal)}
              </strong>
              →
              <strong>
                ${escapeHTML(tujuan)}
              </strong>.
            </p>

          </div>

        `;

        return;

      }


      status.textContent =
        `${data.length} data ditemukan.`;


      const grouped = {};


      data.forEach(item => {

        const key =
          item.kereta || "Kereta";


        if (!grouped[key]) {

          grouped[key] = {

            kereta: item.kereta,

            asal:
              item.stasiunAsal,

            tujuan:
              item.stasiunTujuan,

            eksekutif: null,

            bisnis: null,

            ekonomi: null,

            jam:
              item.jam ||
              item.keberangkatan ||
              ""

          };

        }


        const kelas =
          item.kelas
            .toLowerCase();


        if (
          kelas.includes("eksekutif")
        ) {

          grouped[key].eksekutif =
            item.tarif;

        }

        else if (
          kelas.includes("bisnis")
        ) {

          grouped[key].bisnis =
            item.tarif;

        }

        else if (
          kelas.includes("ekonomi")
        ) {

          grouped[key].ekonomi =
            item.tarif;

        }


        if (
          !grouped[key].jam &&
          (
            item.jam ||
            item.keberangkatan
          )
        ) {

          grouped[key].jam =
            item.jam ||
            item.keberangkatan;

        }

      });


      const trains =
        Object.values(grouped);


      results.innerHTML =
        trains
          .map((train, index) => {

            return `

              <div
                class="result-card"
                style="animation-delay:${index * 0.08}s"
              >

                <div class="result-top">

                  <div class="train-name">
                    🚆
                    ${escapeHTML(
                      train.kereta || "Kereta"
                    )}
                  </div>

                  <div class="available-badge">
                    ● TERSEDIA
                  </div>

                </div>


                <div class="route">

                  <span>
                    ${escapeHTML(train.asal)}
                  </span>

                  <span class="route-arrow">
                    →
                  </span>

                  <span>
                    ${escapeHTML(train.tujuan)}
                  </span>

                </div>


                <div class="price-grid">

                  <div class="price-item">

                    <div class="price-label">
                      EKSEKUTIF
                    </div>

                    <div class="price">
                      ${formatRupiah(
                        train.eksekutif
                      )}
                    </div>

                  </div>


                  <div class="price-item">

                    <div class="price-label">
                      BISNIS
                    </div>

                    <div class="price">
                      ${formatRupiah(
                        train.bisnis
                      )}
                    </div>

                  </div>


                  <div class="price-item">

                    <div class="price-label">
                      EKONOMI
                    </div>

                    <div class="price">
                      ${formatRupiah(
                        train.ekonomi
                      )}
                    </div>

                  </div>

                </div>


                <div class="departure">

                  <span>
                    Keberangkatan
                  </span>

                  <strong>
                    ${escapeHTML(
                      train.jam || "-"
                    )}
                  </strong>

                </div>

              </div>

            `;

          })
          .join("");

    }


    /* =========================
       INITIAL LOAD
    ========================= */

    loadData();

  </script>

</body>
</html>
