<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARSUS FINDER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #080b10;
    --bg-soft: #0d1219;
    --card: rgba(18, 24, 32, 0.78);
    --card-hover: rgba(24, 31, 41, 0.92);

    --gold: #d9b56d;
    --gold-soft: #b99555;
    --gold-light: #f0d79b;

    --text: #f4f5f7;
    --text-soft: #aeb5bf;
    --muted: #727b87;

    --border: rgba(255,255,255,.075);
    --border-gold: rgba(217,181,109,.25);

    --green: #8bd7ad;

    --radius: 22px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: "DM Sans", sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(217,181,109,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(83,110,145,.07),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #07090d 0%,
            #0b1016 50%,
            #080b10 100%
        );

    overflow-x: hidden;
}


/* =========================================================
   DECORATIVE BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 75%
    );

    pointer-events: none;
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;

    width: 480px;
    height: 480px;

    top: -260px;
    right: -180px;

    border: 1px solid rgba(217,181,109,.08);
    border-radius: 50%;

    box-shadow:
        0 0 0 40px rgba(217,181,109,.015),
        0 0 0 80px rgba(217,181,109,.012);

    pointer-events: none;
    z-index: -1;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: min(920px, calc(100% - 32px));
    margin: auto;
    padding: 44px 0 70px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    margin-bottom: 36px;

    animation: fadeDown .7s ease both;
}

.brand-mark {
    width: 54px;
    height: 54px;

    margin: 0 auto 18px;

    display: grid;
    place-items: center;

    border: 1px solid var(--border-gold);
    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(217,181,109,.14),
            rgba(217,181,109,.025)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 12px 40px rgba(0,0,0,.25);

    color: var(--gold-light);

    font-family: Manrope, sans-serif;
    font-size: 21px;
    font-weight: 800;

    position: relative;
}

.brand-mark::before {
    content: "";
    position: absolute;
    inset: 6px;

    border: 1px solid rgba(217,181,109,.12);
    border-radius: 13px;
}

.brand-mark span {
    position: relative;
    z-index: 2;
}

.header h1 {
    font-family: Manrope, sans-serif;
    font-size: clamp(27px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: .08em;

    background:
        linear-gradient(
            120deg,
            #fff,
            var(--gold-light),
            #fff
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.header p {
    margin-top: 9px;

    color: var(--text-soft);
    font-size: 13px;
    letter-spacing: .05em;
}


/* =========================================================
   SEARCH PANEL
========================================================= */

.search-panel {
    position: relative;

    padding: 25px;

    border: 1px solid var(--border);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(24,30,39,.78),
            rgba(12,16,22,.82)
        );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.035);

    animation: fadeUp .75s .1s ease both;
}

.search-panel::before {
    content: "";

    position: absolute;
    top: 0;
    left: 13%;
    right: 13%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(217,181,109,.45),
            transparent
        );
}


/* =========================================================
   ROUTE AREA
========================================================= */

.route-grid {
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    align-items: end;
    gap: 14px;
}


/* =========================================================
   FIELD
========================================================= */

.field {
    position: relative;
}

.field-label {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 9px;

    color: var(--muted);
    font-size: 11px;
    font-weight: 700;

    letter-spacing: .13em;
    text-transform: uppercase;
}

.field-label .dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(217,181,109,.45);
}

.input-wrap {
    position: relative;
}

.input-wrap input {
    width: 100%;
    height: 58px;

    padding: 0 18px;

    border: 1px solid var(--border);
    border-radius: 16px;

    outline: none;

    color: var(--text);

    background:
        rgba(7,10,14,.68);

    font-family: "DM Sans", sans-serif;
    font-size: 15px;
    font-weight: 600;

    transition:
        border .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.input-wrap input::placeholder {
    color: #59616d;
    font-weight: 400;
}

.input-wrap input:focus {
    border-color: rgba(217,181,109,.45);

    background: rgba(7,10,14,.88);

    box-shadow:
        0 0 0 4px rgba(217,181,109,.055),
        0 10px 30px rgba(0,0,0,.18);
}


/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    position: absolute;

    top: calc(100% + 8px);
    left: 0;
    right: 0;

    z-index: 100;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 15px;

    background:
        rgba(14,19,26,.97);

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    animation: suggestionIn .18s ease both;
}

.suggestion-item {
    padding: 13px 16px;

    color: #dfe3e8;

    font-size: 14px;
    font-weight: 500;

    cursor: pointer;

    border-bottom: 1px solid rgba(255,255,255,.045);

    transition:
        background .2s ease,
        color .2s ease,
        padding-left .2s ease;
}

.suggestion-item:last-child {
    border-bottom: 0;
}

.suggestion-item:hover {
    padding-left: 20px;

    background:
        rgba(217,181,109,.075);

    color: var(--gold-light);
}


/* =========================================================
   SWAP BUTTON
========================================================= */

.swap-wrap {
    display: flex;
    justify-content: center;
}

#swapBtn {
    width: 48px;
    height: 48px;

    border: 1px solid rgba(217,181,109,.22);
    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(217,181,109,.12),
            rgba(217,181,109,.035)
        );

    color: var(--gold-light);

    font-size: 19px;

    cursor: pointer;

    transition:
        transform .3s cubic-bezier(.2,.8,.2,1),
        background .25s ease,
        border .25s ease,
        box-shadow .25s ease;
}

#swapBtn:hover {
    transform: rotate(180deg);

    border-color: rgba(217,181,109,.5);

    background:
        rgba(217,181,109,.14);

    box-shadow:
        0 8px 25px rgba(217,181,109,.09);
}

#swapBtn:active {
    transform: rotate(180deg) scale(.92);
}


/* =========================================================
   SEARCH BUTTON
========================================================= */

.search-button {
    width: 100%;
    height: 57px;

    margin-top: 21px;

    border: 1px solid rgba(217,181,109,.35);
    border-radius: 16px;

    color: #16130d;

    background:
        linear-gradient(
            135deg,
            #e8cc91,
            #c99f52
        );

    font-family: Manrope, sans-serif;
    font-size: 14px;
    font-weight: 800;

    letter-spacing: .07em;
    text-transform: uppercase;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25);

    transition:
        transform .2s ease,
        box-shadow .25s ease;
}

.search-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .7s ease;
}

.search-button:hover::before {
    left: 130%;
}

.search-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 16px 38px rgba(0,0,0,.35),
        0 0 30px rgba(217,181,109,.07);
}

.search-button:active {
    transform: translateY(0) scale(.99);
}


/* =========================================================
   STATUS
========================================================= */

#status {
    min-height: 20px;

    margin: 23px 4px 0;

    color: var(--muted);

    font-size: 12px;
    text-align: center;
}


/* =========================================================
   RESULTS
========================================================= */

#results {
    margin-top: 26px;
}

.results-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 13px;

    padding: 0 4px;
}

.results-heading span:first-child {
    color: var(--text-soft);

    font-size: 12px;
    font-weight: 700;

    letter-spacing: .12em;
    text-transform: uppercase;
}

.results-heading span:last-child {
    color: var(--muted);
    font-size: 11px;
}


/* =========================================================
   RESULT CARD
========================================================= */

.result-card {
    position: relative;

    padding: 22px 23px;

    margin-bottom: 12px;

    border: 1px solid var(--border);
    border-radius: var(--radius);

    background:
        linear-gradient(
            135deg,
            rgba(22,28,36,.83),
            rgba(12,16,22,.82)
        );

    box-shadow:
        0 14px 35px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.025);

    overflow: hidden;

    animation: resultIn .45s cubic-bezier(.2,.8,.2,1) both;

    transition:
        transform .25s ease,
        border .25s ease,
        background .25s ease;
}

.result-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 18px;
    bottom: 18px;

    width: 2px;

    border-radius: 2px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            var(--gold),
            transparent
        );

    opacity: .65;
}

.result-card:hover {
    transform: translateY(-3px);

    border-color:
        rgba(217,181,109,.18);

    background:
        var(--card-hover);
}


/* =========================================================
   RESULT CONTENT
========================================================= */

.result-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
}

.result-name {
    font-family: Manrope, sans-serif;

    color: #fff;

    font-size: 18px;
    font-weight: 800;

    letter-spacing: .01em;
}

.result-route {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-top: 9px;

    color: var(--text-soft);

    font-size: 13px;
    font-weight: 500;
}

.route-arrow {
    color: var(--gold);
    font-size: 14px;
}


/* =========================================================
   FARE
========================================================= */

.fare-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;

    gap: 7px;
}

.fare-item {
    min-width: 92px;

    padding: 9px 12px;

    border: 1px solid rgba(255,255,255,.065);
    border-radius: 11px;

    background:
        rgba(255,255,255,.025);

    text-align: center;
}

.fare-class {
    display: block;

    margin-bottom: 3px;

    color: var(--muted);

    font-size: 9px;
    font-weight: 800;

    letter-spacing: .12em;
}

.fare-price {
    display: block;

    color: var(--gold-light);

    font-family: Manrope, sans-serif;

    font-size: 13px;
    font-weight: 800;
}

.fare-unavailable {
    color: #535b66;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    padding: 50px 25px;

    border: 1px dashed rgba(255,255,255,.08);
    border-radius: 22px;

    text-align: center;

    background:
        rgba(255,255,255,.015);

    animation: fadeUp .4s ease both;
}

.empty-symbol {
    width: 52px;
    height: 52px;

    margin: 0 auto 15px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(217,181,109,.15);
    border-radius: 16px;

    color: var(--gold-soft);

    font-size: 19px;
}

.empty-state h3 {
    color: #dfe3e8;

    font-family: Manrope, sans-serif;

    font-size: 15px;
}

.empty-state p {
    max-width: 370px;

    margin: 7px auto 0;

    color: var(--muted);

    font-size: 12px;
    line-height: 1.7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 38px;

    color: #454d58;

    font-size: 10px;
    text-align: center;

    letter-spacing: .1em;
    text-transform: uppercase;
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes suggestionIn {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 680px) {

    .app {
        width: min(100% - 20px, 920px);
        padding-top: 28px;
    }

    .header {
        margin-bottom: 25px;
    }

    .brand-mark {
        width: 48px;
        height: 48px;

        border-radius: 15px;

        font-size: 18px;
    }

    .header h1 {
        font-size: 27px;
    }

    .header p {
        font-size: 11px;
    }

    .search-panel {
        padding: 18px;

        border-radius: 22px;
    }

    .route-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .swap-wrap {
        position: absolute;

        right: 30px;
        top: 94px;

        z-index: 5;
    }

    #swapBtn {
        width: 40px;
        height: 40px;

        border-radius: 13px;

        font-size: 16px;
    }

    .input-wrap input {
        height: 54px;
    }

    .field:nth-child(3) .field-label {
        margin-top: 5px;
    }

    .result-card {
        padding: 19px;
    }

    .result-top {
        display: block;
    }

    .fare-list {
        justify-content: flex-start;

        margin-top: 16px;
    }

    .fare-item {
        min-width: 88px;
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="brand-mark">
            <span>✦</span>
        </div>

        <h1>TARSUS FINDER</h1>

        <p>
            Special Fare Search System
        </p>

    </header>



    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <section class="search-panel">

        <div class="route-grid">


            <!-- ASAL -->

            <div class="field">

                <div class="field-label">
                    <span class="dot"></span>
                    Stasiun Asal
                </div>

                <div class="input-wrap">

                    <input
                        type="text"
                        id="asal"
                        autocomplete="off"
                        placeholder="Cari stasiun asal..."
                    >

                    <div
                        id="asal-suggestions"
                        class="suggestions"
                    ></div>

                </div>

            </div>



            <!-- SWAP -->

            <div class="swap-wrap">

                <button
                    id="swapBtn"
                    type="button"
                    title="Tukar stasiun"
                >
                    ⇄
                </button>

            </div>



            <!-- TUJUAN -->

            <div class="field">

                <div class="field-label">
                    <span class="dot"></span>
                    Stasiun Tujuan
                </div>

                <div class="input-wrap">

                    <input
                        type="text"
                        id="tujuan"
                        autocomplete="off"
                        placeholder="Cari stasiun tujuan..."
                    >

                    <div
                        id="tujuan-suggestions"
                        class="suggestions"
                    ></div>

                </div>

            </div>


        </div>


        <button
            id="searchBtn"
            class="search-button"
            type="button"
        >
            Temukan Tarif Khusus
        </button>


        <div id="status"></div>

    </section>



    <!-- =====================================================
         RESULTS
    ====================================================== -->

    <section id="results"></section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">
        TARSUS FINDER · KAI Special Fare Database
    </div>


</div>



<!-- =========================================================
     DATA ENGINE
========================================================= -->

<script src="data.js"></script>


<script>

/* =========================================================
   TAMBAHAN TAMPILAN
   Tidak mengubah mesin pencarian utama.
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    const results = document.getElementById("results");

    /*
       Jika data.js menghasilkan elemen hasil dengan
       struktur lama, kita biarkan mesin pencari bekerja.

       Observer ini hanya memberi animasi pada hasil baru.
    */

    if (!results) return;

    const observer = new MutationObserver(() => {

        const cards =
            results.querySelectorAll(
                ".result-card"
            );

        cards.forEach((card, index) => {

            card.style.animationDelay =
                `${Math.min(index * 70, 350)}ms`;

        });

    });

    observer.observe(results, {
        childList: true,
        subtree: true
    });

});


/* =========================================================
   ICON SWAP
========================================================= */

const swapBtn =
    document.getElementById("swapBtn");

if (swapBtn) {

    swapBtn.addEventListener("click", () => {

        swapBtn.animate(
            [
                {
                    transform: "rotate(0deg)"
                },
                {
                    transform: "rotate(180deg)"
                }
            ],
            {
                duration: 350,
                easing: "cubic-bezier(.2,.8,.2,1)"
            }
        );

    });

}

</script>

</body>
</html>
