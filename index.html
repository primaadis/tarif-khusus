<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TARSUS FINDER</title>

<meta name="description"
      content="Pencarian tarif khusus kereta api">


<!-- FONT -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet">


<style>


/* =========================================
   RESET
========================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    font-family:
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #eef3f8;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(255, 107, 26, .13),
            transparent 34%
        ),

        radial-gradient(
            circle at 100% 80%,
            rgba(21, 67, 112, .18),
            transparent 30%
        ),

        #07111f;

    overflow-x: hidden;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================
   BACKGROUND
========================================= */

body::before {

    content: "";

    position: fixed;

    width: 520px;
    height: 520px;

    top: -280px;
    right: -190px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255, 107, 26, .10),
            transparent 68%
        );

    pointer-events: none;

    z-index: -1;

    animation:
        ambientGlow 9s ease-in-out infinite alternate;

}


body::after {

    content: "";

    position: fixed;

    width: 450px;
    height: 450px;

    bottom: -270px;
    left: -190px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(18, 61, 103, .25),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;

}


@keyframes ambientGlow {

    from {

        transform:
            translate3d(0, 0, 0);

        opacity: .55;

    }

    to {

        transform:
            translate3d(-28px, 22px, 0);

        opacity: 1;

    }

}


/* =========================================
   APP
========================================= */

.app {

    width: 100%;

    max-width: 820px;

    margin: auto;

    padding:
        28px
        18px
        60px;

}


/* =========================================
   HEADER
========================================= */

.header {

    position: relative;

    padding:
        24px
        4px
        34px;

    text-align: center;

}


.header::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: 8px;

    width: 90px;
    height: 2px;

    transform:
        translateX(-50%);

    border-radius: 50px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff6b1a 25%,
            #ff8b4a 50%,
            #ff6b1a 75%,
            transparent
        );

    box-shadow:

        0 0 14px
        rgba(255, 107, 26, .35);

    animation:
        headerLine 3s ease-in-out infinite;

}


@keyframes headerLine {

    0%,
    100% {

        width: 65px;

        opacity: .55;

    }

    50% {

        width: 105px;

        opacity: 1;

    }

}


/* =========================================
   BRAND
========================================= */

.brand {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    margin-bottom: 10px;

}


.brand-mark {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 46px;
    height: 46px;

    border-radius: 14px;

    background:

        linear-gradient(
            145deg,
            #ff8a45,
            #ed5008
        );

    border:
        1px solid
        rgba(255, 170, 120, .25);

    box-shadow:

        0 8px 25px
        rgba(255, 88, 10, .18),

        inset 0 1px 0
        rgba(255, 255, 255, .16);

    font-size: 21px;

    transform:
        rotate(-3deg);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.brand-mark::after {

    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid
        rgba(255, 255, 255, .10);

    border-radius: 10px;

}


.brand:hover .brand-mark {

    transform:
        rotate(3deg)
        translateY(-2px);

    box-shadow:

        0 12px 30px
        rgba(255, 88, 10, .25),

        inset 0 1px 0
        rgba(255, 255, 255, .18);

}


/* =========================================
   TITLE
========================================= */

.brand-name {

    position: relative;

    font-family:
        "Manrope",
        "Inter",
        sans-serif;

    font-size: 30px;

    font-weight: 800;

    letter-spacing: .08em;

    line-height: 1;

    color: #ffffff;

    text-shadow:
        0 4px 20px
        rgba(0, 0, 0, .35);

}


.brand-name::after {

    content: "";

    position: absolute;

    left: 0;

    bottom: -7px;

    width: 30px;
    height: 2px;

    border-radius: 10px;

    background:
        #ff6b1a;

    box-shadow:
        0 0 10px
        rgba(255, 107, 26, .45);

}


/* =========================================
   SUBTITLE
========================================= */

.subtitle {

    margin-top: 6px;

    color: #8795a5;

    font-size: 12px;

    font-weight: 500;

    letter-spacing: .08em;

    text-transform: uppercase;

}


/* =========================================
   SEARCH PANEL
========================================= */

.search-panel {

    position: relative;

    padding: 19px;

    border:
        1px solid
        rgba(255, 255, 255, .07);

    border-radius: 20px;

    background:

        linear-gradient(
            145deg,
            rgba(18, 35, 55, .94),
            rgba(9, 23, 39, .94)
        );

    box-shadow:

        0 18px 50px
        rgba(0, 0, 0, .25);

    backdrop-filter:
        blur(12px);

    animation:
        panelEnter .6s ease both;

}


@keyframes panelEnter {

    from {

        opacity: 0;

        transform:
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}
      /* =========================================
   ROUTE INPUT
========================================= */

.route-wrapper {

    position: relative;

    display: grid;

    grid-template-columns:
        1fr 48px 1fr;

    gap: 10px;

    align-items: end;

}


.field {

    position: relative;

}


.field-label {

    display: block;

    margin:
        0
        0
        8px
        3px;

    color: #94a3b3;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .08em;

    text-transform: uppercase;

}


.input-wrap {

    position: relative;

}


.station-input {

    width: 100%;

    height: 52px;

    padding:
        0
        15px;

    border:
        1px solid
        rgba(255, 255, 255, .09);

    border-radius: 13px;

    outline: none;

    color: #ffffff;

    background:
        rgba(5, 16, 29, .72);

    font-family: inherit;

    font-size: 14px;

    -webkit-tap-highlight-color:
        transparent;

    transition:

        border-color .25s ease,

        box-shadow .25s ease,

        background .25s ease;

}


.station-input::placeholder {

    color: #667587;

}


.station-input:hover {

    border-color:
        rgba(255, 255, 255, .14);

}


.station-input:focus {

    border-color:
        rgba(255, 107, 26, .65);

    background:
        rgba(5, 16, 29, .92);

    box-shadow:

        0 0 0 3px
        rgba(255, 107, 26, .08);

}


/* =========================================
   AUTOCOMPLETE
========================================= */

.suggestions {

    position: absolute;

    top: calc(100% + 7px);

    left: 0;

    right: 0;

    z-index: 100;

    overflow: hidden;

    border:
        1px solid
        rgba(255, 255, 255, .08);

    border-radius: 13px;

    background:
        #0c1b2c;

    box-shadow:

        0 18px 40px
        rgba(0, 0, 0, .38);

}


.suggestion-item {

    padding:
        13px
        14px;

    color: #d3dce5;

    font-size: 13px;

    cursor: pointer;

    transition:

        background .2s ease,

        color .2s ease,

        padding-left .2s ease;

}


.suggestion-item:hover {

    padding-left: 18px;

    color: #ffffff;

    background:
        rgba(255, 107, 26, .09);

}


/* =========================================
   SWAP
========================================= */

.swap-button {

    width: 48px;

    height: 48px;

    border:
        1px solid
        rgba(255, 107, 26, .25);

    border-radius: 14px;

    outline: none;

    color: #ff7b32;

    background:
        rgba(255, 107, 26, .07);

    cursor: pointer;

    font-family: inherit;

    font-size: 20px;

    -webkit-tap-highlight-color:
        transparent;

    transition:

        transform .4s
        cubic-bezier(.2,.8,.2,1),

        background .25s ease,

        border-color .25s ease,

        color .25s ease;

}


.swap-button:hover {

    background:
        rgba(255, 107, 26, .15);

    border-color:
        rgba(255, 107, 26, .55);

    color: #ff914f;

    transform:
        rotate(180deg);

}


.swap-button:active {

    transform:
        rotate(180deg)
        scale(.92);

}


.swap-button:focus,
.swap-button:focus-visible {

    outline: none;

    box-shadow: none;

}


/* =========================================
   SEARCH BUTTON
========================================= */

.search-button {

    width: 100%;

    height: 52px;

    margin-top: 15px;

    border: none;

    border-radius: 13px;

    outline: none;

    color: #ffffff;

    background:

        linear-gradient(
            100deg,
            #e9570a,
            #ff762d
        );

    font-family: inherit;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: .02em;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:

        0 10px 28px
        rgba(255, 107, 26, .16);

    transition:

        transform .2s ease,

        box-shadow .25s ease,

        filter .25s ease;

}


.search-button:hover {

    filter:
        brightness(1.08);

    box-shadow:

        0 13px 32px
        rgba(255, 107, 26, .23);

    transform:
        translateY(-1px);

}


.search-button:active {

    transform:
        translateY(1px)
        scale(.99);

}


.search-button:focus,
.search-button:focus-visible {

    outline: none;

    box-shadow:

        0 10px 28px
        rgba(255, 107, 26, .16);

}


/* =========================================
   DATABASE STATUS
========================================= */

.database-status {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 7px;

    margin-top: 13px;

    color: #718196;

    font-size: 11px;

}


.status-dot {

    width: 6px;

    height: 6px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        #ff762d;

    box-shadow:
        0 0 10px
        rgba(255, 118, 45, .65);

    animation:
        statusPulse 2s ease-in-out infinite;

}


@keyframes statusPulse {

    0%,
    100% {

        opacity: .55;

        transform:
            scale(.9);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.15);

    }

}
      /* =========================================
   RESULT HEADER
========================================= */

.result-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin:
        32px
        3px
        13px;

}


.result-title {

    color: #ffffff;

    font-family:
        "Manrope",
        "Inter",
        sans-serif;

    font-size: 15px;

    font-weight: 800;

}


.result-count {

    color: #7d8da0;

    font-size: 11px;

}


/* =========================================
   RESULTS
========================================= */

#results {

    display: flex;

    flex-direction: column;

    gap: 12px;

}


.result-card {

    position: relative;

    padding: 18px;

    overflow: hidden;

    border:
        1px solid
        rgba(255, 255, 255, .065);

    border-radius: 17px;

    background:

        linear-gradient(
            145deg,
            rgba(17, 34, 53, .94),
            rgba(9, 22, 37, .94)
        );

    box-shadow:

        0 10px 30px
        rgba(0, 0, 0, .17);

    animation:
        resultEnter .45s ease both;

    transition:

        border-color .25s ease,

        transform .25s ease,

        box-shadow .25s ease;

}


.result-card::before {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: 3px;

    background:

        linear-gradient(
            180deg,
            #ff6b1a,
            rgba(255, 107, 26, .12)
        );

    opacity: .85;

}


.result-card::after {

    content: "";

    position: absolute;

    width: 140px;

    height: 140px;

    top: -90px;

    right: -70px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255, 107, 26, .08),
            transparent 70%
        );

    pointer-events: none;

}


.result-card:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(255, 107, 26, .18);

    box-shadow:

        0 15px 35px
        rgba(0, 0, 0, .24);

}


@keyframes resultEnter {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================
   TRAIN
========================================= */

.result-train {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #ffffff;

    font-family:
        "Manrope",
        "Inter",
        sans-serif;

    font-size: 17px;

    font-weight: 800;

    margin-bottom: 8px;

}


/* =========================================
   USER ROUTE
========================================= */

.result-route {

    color: #a9b5c1;

    font-size: 13px;

    font-weight: 500;

    margin-bottom: 14px;

}


/* =========================================
   SPECIAL ROUTE
========================================= */

.special-route {

    padding:
        11px
        12px;

    border:
        1px solid
        rgba(255, 255, 255, .04);

    border-radius: 10px;

    color: #909eae;

    background:
        rgba(255, 255, 255, .035);

    font-size: 12px;

    line-height: 1.65;

}


.special-route strong {

    color: #ff8745;

    font-weight: 700;

}


/* =========================================
   FARE LIST
========================================= */

.fare-list {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 12px;

}


.fare-item {

    padding:
        11px
        9px;

    border:
        1px solid
        rgba(255, 255, 255, .05);

    border-radius: 10px;

    background:
        rgba(4, 13, 24, .42);

    text-align: center;

    transition:

        background .2s ease,

        border-color .2s ease;

}


.fare-item:hover {

    border-color:
        rgba(255, 107, 26, .15);

    background:
        rgba(255, 107, 26, .035);

}


.fare-label {

    color: #7c8b9c;

    font-size: 10px;

    font-weight: 600;

    margin-bottom: 6px;

}


.fare-price {

    color: #f1f5f8;

    font-family:
        "Manrope",
        "Inter",
        sans-serif;

    font-size: 13px;

    font-weight: 800;

}


/* =========================================
   LOADING
========================================= */

.loading {

    display: none;

    padding: 28px;

    text-align: center;

    color: #8291a3;

    font-size: 12px;

}


.loading-spinner {

    width: 25px;

    height: 25px;

    margin:
        0
        auto
        11px;

    border:
        2px solid
        rgba(255, 255, 255, .08);

    border-top-color:
        #ff6b1a;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =========================================
   EMPTY / ERROR
========================================= */

.empty,
.error-box {

    display: none;

    margin-top: 13px;

    padding:
        27px
        19px;

    border:
        1px solid
        rgba(255, 255, 255, .06);

    border-radius: 15px;

    text-align: center;

    color: #7d8da0;

    background:
        rgba(11, 25, 41, .65);

    font-size: 12px;

    line-height: 1.65;

}


.error-box {

    color: #ff9b75;

    border-color:
        rgba(255, 107, 26, .15);

      }
      /* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 40px;

    padding-top: 5px;

    text-align: center;

    color: #4d5d6f;

    font-size: 10px;

    font-weight: 500;

    letter-spacing: .05em;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 560px) {


    .app {

        padding:
            20px
            13px
            45px;

    }


    /* HEADER */

    .header {

        padding:
            18px
            4px
            29px;

    }


    .brand {

        gap: 10px;

    }


    .brand-mark {

        width: 40px;

        height: 40px;

        border-radius: 12px;

        font-size: 18px;

    }


    .brand-name {

        font-size: 23px;

        letter-spacing: .07em;

    }


    .brand-name::after {

        bottom: -6px;

        width: 24px;

    }


    .subtitle {

        font-size: 10px;

        letter-spacing: .07em;

    }


    /* SEARCH PANEL */

    .search-panel {

        padding: 15px;

        border-radius: 17px;

    }


    /* ROUTE */

    .route-wrapper {

        grid-template-columns:
            1fr 42px 1fr;

        gap: 7px;

    }


    .field-label {

        font-size: 10px;

    }


    /* INPUT */

    .station-input {

        height: 49px;

        padding:
            0
            11px;

        border-radius: 12px;

        font-size: 13px;

    }


    /* SWAP */

    .swap-button {

        width: 42px;

        height: 42px;

        border-radius: 12px;

        font-size: 18px;

    }


    /* SEARCH */

    .search-button {

        height: 49px;

        margin-top: 13px;

        border-radius: 12px;

        font-size: 13px;

    }


    /* STATUS */

    .database-status {

        font-size: 10px;

    }


    /* RESULT HEADER */

    .result-header {

        margin:
            28px
            2px
            12px;

    }


    .result-title {

        font-size: 14px;

    }


    .result-count {

        font-size: 10px;

    }


    /* CARD */

    .result-card {

        padding: 16px;

        border-radius: 15px;

    }


    .result-train {

        font-size: 16px;

    }


    .result-route {

        font-size: 12px;

    }


    .special-route {

        font-size: 11px;

        line-height: 1.6;

    }


    /* FARE */

    .fare-list {

        grid-template-columns:
            1fr;

        gap: 6px;

    }


    .fare-item {

        display: flex;

        justify-content:
            space-between;

        align-items: center;

        padding:
            10px
            12px;

        text-align: left;

    }


    .fare-label {

        margin-bottom: 0;

        font-size: 10px;

    }


    .fare-price {

        font-size: 13px;

    }


    /* AUTOCOMPLETE */

    .suggestion-item {

        padding:
            12px
            13px;

        font-size: 12px;

    }


    /* FOOTER */

    .footer {

        margin-top: 32px;

        font-size: 9px;

    }

}


/* =========================================
   VERY SMALL PHONE
========================================= */

@media (max-width: 360px) {


    .app {

        padding-left: 10px;

        padding-right: 10px;

    }


    .brand-name {

        font-size: 20px;

    }


    .brand-mark {

        width: 36px;

        height: 36px;

        font-size: 16px;

    }


    .station-input {

        font-size: 12px;

    }


    .result-train {

        font-size: 15px;

    }


    .result-route {

        font-size: 11px;

    }


    .special-route {

        font-size: 10px;

    }


}


/* =========================================
   ANDROID TOUCH
========================================= */

button,
input {

    -webkit-tap-highlight-color:
        transparent;

}


button {

    -webkit-appearance: none;

    appearance: none;

}


button:focus,
button:focus-visible {

    outline: none;

}


/* =========================================
   REMOVE BUTTON GLOW
========================================= */

.search-button:focus,
.search-button:focus-visible {

    outline: none;

    box-shadow:
        0 10px 28px
        rgba(255, 107, 26, .16);

}


.swap-button:focus,
.swap-button:focus-visible {

    outline: none;

    box-shadow: none;

}


/* =========================================
   REDUCE MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

        transition-duration:
            .01ms !important;

    }

}

</style>
</head>


<body>


<main class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">


        <div class="brand">


            <div class="brand-mark">
                🚆
            </div>


            <div class="brand-name">
                TARSUS FINDER
            </div>


        </div>


        <p class="subtitle">
            Pencarian Tarif Khusus Kereta Api
        </p>


    </header>



    <!-- =====================================
         SEARCH PANEL
    ====================================== -->

    <section class="search-panel">


        <div class="route-wrapper">


            <!-- ASAL -->

            <div class="field">


                <label
                    class="field-label"
                    for="asal"
                >
                    Stasiun Asal
                </label>


                <div class="input-wrap">


                    <input
                        type="text"
                        id="asal"
                        class="station-input"
                        placeholder="Contoh: Kroya"
                        autocomplete="off"
                    >


                    <div
                        id="suggestionsAsal"
                        class="suggestions"
                    ></div>


                </div>


            </div>



            <!-- SWAP -->

            <button
                type="button"
                id="swapBtn"
                class="swap-button"
                aria-label="Tukar stasiun"
                title="Tukar stasiun"
            >
                ⇄
            </button>



            <!-- TUJUAN -->

            <div class="field">


                <label
                    class="field-label"
                    for="tujuan"
                >
                    Stasiun Tujuan
                </label>


                <div class="input-wrap">


                    <input
                        type="text"
                        id="tujuan"
                        class="station-input"
                        placeholder="Contoh: Yogyakarta"
                        autocomplete="off"
                    >


                    <div
                        id="suggestionsTujuan"
                        class="suggestions"
                    ></div>


                </div>


            </div>


        </div>



        <!-- SEARCH BUTTON -->

        <button
            type="button"
            id="searchBtn"
            class="search-button"
        >
            Cari Tarif Khusus
        </button>



        <!-- DATABASE STATUS -->

        <div class="database-status">

            <span class="status-dot"></span>

            <span id="status">
                Menghubungkan database...
            </span>

        </div>


    </section>



    <!-- =====================================
         RESULT HEADER
    ====================================== -->

    <div class="result-header">


        <div class="result-title">
            Hasil Pencarian
        </div>


        <div
            id="resultCount"
            class="result-count"
        >
            Belum ada pencarian
        </div>


    </div>



    <!-- =====================================
         LOADING
    ====================================== -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-spinner"></div>

        Memuat database...

    </div>



    <!-- =====================================
         ERROR
    ====================================== -->

    <div
        id="errorBox"
        class="error-box"
    ></div>



    <!-- =====================================
         EMPTY
    ====================================== -->

    <div
        id="empty"
        class="empty"
    >

        Tarif khusus tidak ditemukan
        untuk rute tersebut.

    </div>



    <!-- =====================================
         RESULTS
    ====================================== -->

    <div id="results"></div>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="footer">

        TARSUS FINDER
        •
        Tarif Khusus Kereta Api

    </footer>


</main>
